9" fill="#000" font-size="20" textLength="100" font-family="SimSun">预结算完成</text><text x="80.22" y="531.813" fill="#000" font-size="20" textLength="260" font-family="SimSun">患者选择医保、自费或待确认</text><text x="80.22" y="554.625" fill="#000" font-size="20" textLength="360" font-family="SimSun">/ 保存说明与实际选择，不自动正式结算</text></g><g class="entity" data-qualified-name="SettlementPending" id="ent0004" data-source-line="21"><rect x="265.22" y="668" width="300" height="88.438" fill="#FFF" style="stroke:#000;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="265.22" y1="700.813" x2="565.22" y2="700.813" style="stroke:#000;stroke-width:0.5;"/><text x="365.22" y="693" fill="#000" font-size="20" textLength="100" font-family="SimSun">结算待核实</text><text x="270.22" y="725.813" fill="#000" font-size="20" textLength="200" font-family="SimSun">平台或本地结果待核实</text><text x="270.22" y="748.625" fill="#000" font-size="20" textLength="280" font-family="SimSun">/ 查原成功结果后补记，不重发</text></g><g class="entity" data-qualified-name="Settled" id="ent0005" data-source-line="22"><rect x="86.22" y="839" width="360" height="134.063" fill="#FFF" style="stroke:#000;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="86.22" y1="871.813" x2="446.22" y2="871.813" style="stroke:#000;stroke-width:0.5;"/><text x="236.22" y="864" fill="#000" font-size="20" textLength="60" font-family="SimSun">已结算</text><text x="91.22" y="896.813" fill="#000" font-size="20" textLength="290" font-family="SimSun">撤销失败或未知 [尚无明确成功]</text><text x="91.22" y="919.625" fill="#000" font-size="20" textLength="340" font-family="SimSun">/ 保留原有效结算，另记撤销办理结果</text><text x="91.22" y="942.438" fill="#000" font-size="20" textLength="220" font-family="SimSun">逐笔核对实际拨付或退回</text><text x="91.22" y="965.25" fill="#000" font-size="20" textLength="340" font-family="SimSun">/ 另记医保结算款，不把结算当作到账</text></g><g class="entity" data-qualified-name="Reversed" id="ent0006" data-source-line="23"><rect x="365.22" y="1079" width="80" height="50" fill="#FFF" style="stroke:#000;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="365.22" y1="1111.813" x2="445.22" y2="1111.813" style="stroke:#000;stroke-width:0.5;"/><text x="375.22" y="1104" fill="#000" font-size="20" textLength="60" font-family="SimSun">已撤销</text></g><g class="start_entity" data-qualified-name=".start." id="ent0007" data-source-line="24"><ellipse cx="425.22" cy="16" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name=".end." id="ent0018" data-source-line="40"><ellipse cx="405.22" cy="1177" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="405.22" cy="1177" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/></g><!--link *start* to IdentityPending--><g class="link" data-entity-1="ent0007" data-entity-2="ent0001" id="lnk8" data-source-line="24" data-link-type="dependency"><path d="M425.22,26.28 C425.22,43.08 425.22,74.51 425.22,103.85" style="stroke:#000;stroke-width:1;" fill="none" id="*start*-to-IdentityPending"/><polygon points="425.22,108.85,429.22,99.85,425.22,103.85,421.22,99.85,425.22,108.85" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="436.22" y="65" fill="#000" font-size="20" textLength="220" font-family="SimSun">医保启用且患者同意核验</text><text x="426.22" y="87.813" fill="#000" font-size="20" textLength="240" font-family="SimSun">/ 保存原业务号及就诊归属</text></g><!--link IdentityPending to EstimatePending--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk9" data-source-line="26" data-link-type="dependency"><path d="M425.22,197.08 C425.22,222.51 425.22,249.58 425.22,275" style="stroke:#000;stroke-width:1;" fill="none" id="IdentityPending-to-EstimatePending"/><polygon points="425.22,280,429.22,271,425.22,275,421.22,271,425.22,280" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="496.22" y="236" fill="#000" font-size="20" textLength="160" font-family="SimSun">核验登记明确通过</tex