<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:529px;height:758px;background:#FFFFFF;" width="529px" height="758px" viewBox="0 0 529 758" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="entity" data-qualified-name="Draft" id="ent0001" data-source-line="18"><rect x="97" y="132" width="230" height="88.438" fill="#FFF" style="stroke:#000;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="97" y1="164.813" x2="327" y2="164.813" style="stroke:#000;stroke-width:0.5;"/><text x="192" y="157" fill="#000" font-size="20" textLength="40" font-family="SimSun">草稿</text><text x="102" y="189.813" fill="#000" font-size="20" textLength="210" font-family="SimSun">暂存或补正 [权限有效]</text><text x="102" y="212.625" fill="#000" font-size="20" textLength="200" font-family="SimSun">/ 不作为有效处方交付</text></g><g class="entity" data-qualified-name="Issued" id="ent0002" data-source-line="19"><rect x="7" y="326" width="410" height="202.5" fill="#FFF" style="stroke:#000;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="7" y1="358.813" x2="417" y2="358.813" style="stroke:#000;stroke-width:0.5;"/><text x="182" y="351" fill="#000" font-size="20" textLength="60" font-family="SimSun">已开立</text><text x="12" y="383.813" fill="#000" font-size="20" textLength="250" font-family="SimSun">院外取药 / 交付处方及指导</text><text x="12" y="406.625" fill="#000" font-size="20" textLength="360" font-family="SimSun">不冒充院内审方，不扣诊所库存或计药费</text><text x="12" y="429.438" fill="#000" font-size="20" textLength="230" font-family="SimSun">药学岗位审核 [院内待审]</text><text x="12" y="452.25" fill="#000" font-size="20" textLength="340" font-family="SimSun">/ 另记已通过或待医师处理及实际依据</text><text x="12" y="475.063" fill="#000" font-size="20" textLength="390" font-family="SimSun">院内实际交付 [审方已通过且供药条件满足]</text><text x="12" y="497.875" fill="#000" font-size="20" textLength="340" font-family="SimSun">/ 逐笔发药、同源出库及费用共同保存</text><text x="12" y="520.688" fill="#000" font-size="20" textLength="260" font-family="SimSun">只记实际量，缺价保留待核价</text></g><g class="entity" data-qualified-name="Voided" id="ent0003" data-source-line="20"><rect x="172" y="635" width="80" height="50" fill="#FFF" style="stroke:#000;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="172" y1="667.813" x2="252" y2="667.813" style="stroke:#000;stroke-width:0.5;"/><text x="182" y="660" fill="#000" font-size="20" textLength="60" font-family="SimSun">已作废</text></g><g class="start_entity" data-qualified-name=".start." id="ent0004" data-source-line="21"><ellipse cx="212" cy="16" rx="10" ry="10" fill="#222" style="stroke:#222;stroke-width:1;"/></g><g class="end_entity" data-qualified-name=".end." id="ent0008" data-source-line="28"><ellipse cx="212" cy="733" rx="11" ry="11" fill="none" style="stroke:#222;stroke-width:1;"/><ellipse cx="212" cy="733" rx="6" ry="6" fill="#222" style="stroke:#222;stroke-width:1;"/></g><!--link *start* to Draft--><g class="link" data-entity-1="ent0004" data-entity-2="ent0001" id="lnk5" data-source-line="21" data-link-type="dependency"><path d="M212,26.41 C212,46.67 212,90.52 212,126.71" style="stroke:#000;stroke-width:1;" fill="none" id="*start*-to-Draft"/><polygon points="212,131.71,216,122.71,212,126.71,208,122.71,212,131.71" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="253" y="65" fill="#000" font-size="20" textLength="180" font-family="SimSun">牙医新开或更正重开</text><text x="233" y="87.813" fill="#000" font-size="20" textLength="220" font-family="SimSun">[患者及实际就诊可核对]</text><text x="213" y="110.625" fill="#000" font-size="20" textLength="260" font-family="SimSun">/ 新处方保留原方和更正依据</text></g><!--link Draft to Issued--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk6" data-source-line="23" data-link-type="dependency"><path d="M212,220.17 C212,249.32 212,284.06 212,320.87" style="stroke:#000;stroke-width:1;" fill="none" id="Draft-to-Issued"/><polygon points="212,325.87,216,316.87,212,320.87,208,316.87,212,325.87" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="273" y="259" fill="#000" font-size="20" textLength="180" font-family="SimSun">牙医确认并说明用药</text><text x="213" y="281.813" fill="#000" font-size="20" textLength="300" font-family="SimSun">[权限、内容及取药路径条件满足]</text><text x="263" y="304.625" fill="#000" font-size="20" textLength="200" font-family="SimSun">/ 保存开立依据和时间</text></g><!--link Issued to Voided--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk7" data-source-line="27" data-link-type="dependency"><path d="M212,529.27 C212,568.27 212,604.53 212,629.78" style="stroke:#000;stroke-width:1;" fill="none" id="Issued-to-Voided"/><polygon points="212,634.78,216,625.78,212,629.78,208,625.78,212,634.78" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="263" y="568" fill="#000" font-size="20" textLength="180" font-family="SimSun">牙医核实更正或停止</text><text x="223" y="590.813" fill="#000" font-size="20" textLength="260" font-family="SimSun">[已确认尚未交付且允许作废]</text><text x="213" y="613.625" fill="#000" font-size="20" textLength="280" font-family="SimSun">/ 原内容保留，需要时另开处方</text></g><!--link Voided to *end*--><g class="link" data-entity-1="ent0003" data-entity-2="ent0008" id="lnk9" data-source-line="28" data-link-type="dependency"><path d="M212,685.04 C212,697.59 212,707.28 212,716.85" style="stroke:#000;stroke-width:1;" fill="none" id="Voided-to-*end*"/><polygon points="212,721.85,216,712.85,212,716.85,208,712.85,212,721.85" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><?plantuml-src XLFBJjj05DtxAqOiAw5MLDrqKQbFgHisaRf9M1Xim2BOo7Q4rAfIGZ4XDC4fXK0W0G8fGhHn0er2NYGVKy_ONlKNUiVZX22GklFSCtFEkUTUQmkIlCIh_2AQvcSMvbGb9WklbQYYekLvIHSvROXhyxoWB4lo79hbezee8eYpV2oglrDaVP9V5558MWp5v8SlXAIF8ffuCWA-L5LbcKbE