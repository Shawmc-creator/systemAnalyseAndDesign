415.188" fill="#000" font-size="18" textLength="270" font-family="SimSun">协调其他时段、牙医或可替代资源</text><polygon points="401.5,323.688,626.5,323.688,638.5,335.688,626.5,347.688,401.5,347.688,389.5,335.688,401.5,323.688" fill="#FFF" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="518" y="365.688" fill="#000" font-size="18" font-family="SimSun">是</text><text x="401.5" y="343.422" fill="#000" font-size="18" textLength="225" font-family="SimSun">任一必需资源冲突或不可用?</text><text x="371.5" y="333.156" fill="#000" font-size="18" font-family="SimSun">否</text><rect x="405" y="469.719" width="218" height="40.531" fill="#FFF" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="415" y="497.719" fill="#000" font-size="18" textLength="198" font-family="SimSun">确认预约并预留所需时段</text><rect x="387" y="530.25" width="254" height="40.531" fill="#FFF" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="397" y="558.25" fill="#000" font-size="18" textLength="234" font-family="SimSun">患者实际到诊后再次核对资源</text><rect x="387" y="718.578" width="254" height="40.531" fill="#FFF" style="stroke:#181818;stroke-width:0.5;" rx="12.5" ry="12.5"/><text x="397" y="746.578" fill="#000" font-size="18" textLength="234" font-family="SimSun">与患者确认并通知受影响预约</text><polygon points="410.5,590.781,617.5,590.781,629.5,602.781,617.5,614.781,410.5,614.781,398.5,602.781,410.5,590.781" fill="#FFF" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="518" y="632.781" fill="#000" font-size="18" font-family="SimSun">是</text><text x="410.5" y="610.516" fill="#000" font-size="18" textLength="207" font-family="SimSun">前一患者延时或突发故障?</text><polygon points="514,779.109,526,791.109,514,803.109,502,791.109,514,779.109" fill="#FFF" style="stroke:#181818;stroke-width:0.5;stroke-linejoin:miter;stroke-miterlimit:10;"/><rect x="405" y="1358.094" width="218" height="40.531" fill="#FFF" style="stroke:#181818;stroke-width:0.5;" rx="12.5"