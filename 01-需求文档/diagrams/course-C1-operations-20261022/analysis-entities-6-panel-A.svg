<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:563px;height:603px;background:#FFFFFF;" width="563px" height="603px" viewBox="0 0 563 603" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--cluster A--><g class="cluster" data-qualified-name="A" id="ent0001" data-source-line="18"><path d="M8.5,6 L195.125,6 A3.75,3.75 0 0 1 197.625,8.5 L204.625,34.813 L545.5,34.813 A2.5,2.5 0 0 1 548,37.313 L548,585.5 A2.5,2.5 0 0 1 545.5,588 L8.5,588 A2.5,2.5 0 0 1 6,585.5 L6,8.5 A2.5,2.5 0 0 1 8.5,6" style="stroke:#000;stroke-width:1.5;" fill="#FFF"/><line x1="6" y1="34.813" x2="204.625" y2="34.813" style="stroke:#000;stroke-width:1.5;"/><text x="10" y="28" fill="#000" font-size="20" textLength="185.625" font-weight="700" font-family="SimSun">牙医评估与完成条件</text></g><!--class requirement_a--><g class="entity" data-qualified-name="A.requirement_a" id="ent0002" data-source-line="20"><rect x="22" y="47" width="220" height="55.625" fill="#FFF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="92" y="72" fill="#000" font-size="20" textLength="80" font-style="italic" font-family="SimSun">«entity»</text><text x="92" y="94.813" fill="#000" font-size="20" textLength="80" font-family="SimSun">诊后要求</text></g><!--class visit_a--><g class="entity" data-qualified-name="A.visit_a" id="ent0003" data-source-line="22"><rect x="312" y="47" width="220" height="55.625" fill="#FFF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="382" y="72" fill="#000" font-size="20" textLength="80" font-style="italic" font-family="SimSun">«entity»</text><text x="402" y="94.813" fill="#000" font-size="20" textLength="40" font-family="SimSun">就诊</text></g><!--class clinical_assessment--><g class="entity" data-qualified-name="A.clinical_assessment" id="ent0004" data-source-line="23"><rect x="121" y="183" width="312" height="231.313" fill="#FFF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="237" y="208" fill="#000" font-size="20" textLength="80" font-style="italic" font-family="SimSun">«entity»</text><text x="237" y="230.813" fill="#000" font-size="20" textLength="80" font-family="SimSun">临床评估</text><line x1="122" y1="238.625" x2="432" y2="238.625" style="stroke:#181818;stroke-width:0.5;"/><text x="127" y="262.625" fill="#000" font-size="20" textLength="300" font-family="SimSun">到诊检查或远程沟通、时间、牙医</text><text x="127" y="285.438" fill="#000" font-size="20" textLength="220" font-family="SimSun">结论、意见、来源及局限</text><text x="127" y="308.25" fill="#000" font-size="20" textLength="200" font-family="SimSun">下次日期、跟进责任人</text><line x1="122" y1="315.063" x2="432" y2="315.063" style="stroke:#181818;stroke-width:1;"/><text x="127" y="339.063" fill="#000" font-size="20" textLength="250" font-family="SimSun">+核对评估方式与实际依据()</text><text x="127" y="361.875" fill="#000" font-size="20" textLength="150" font-family="SimSun">+追加实际评估()</text><text x="127" y="384.688" fill="#000" font-size="20" textLength="210" font-family="SimSun">+判断原目的是否达到()</text><text x="127" y="407.5" fill="#000" font-size="20" textLength="270" font-family="SimSun">+记录继续跟进(日期与责任人)</text></g><g class="entity" data-qualified-name="A.GMN8" id="ent0009" data-source-line="37"><path d="M26.5,494 L26.5,572.438 A0,0 0 0 0 26.5,572.438 L527.5,572.438 A0,0 0 0 0 527.5,572.438 L527.5,504 L517.5,494 L281,494 L277,414.03 L273,494 L26.5,494 A0,0 0 0 0 26.5,494" style="stroke:#000;stroke-width:0.5;" fill="#FFF"/><path d="M517.5,494 L517.5,504 L527.5,504 L517.5,494" style="stroke:#000;stroke-width:0.5;" fill="#FFF"/><text x="32.5" y="519" fill="#000" font-size="20" textLength="460" font-family="SimSun">目的达到且评估完整才完成，评估与完成共同保存。</text><text x="32.5" y="541.813" fill="#000" font-size="20" textLength="480" font-family="SimSun">远程信息不足则安排到诊；继续跟进有日期及责任人。</text><text x="32.5" y="564.625" fill="#000" font-size="20" textLength="360" font-family="SimSun">已有安排待到诊或评估，否则转待联系。</text></g><!--link requirement_a to clinical_assessment--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk5" data-source-line="33" data-link-type="association"><path d="M181.5,103.31 C181.5,123.86 181.5,153.17 181.5,182.85" style="stroke:#000;stroke-width:1;" fill="none" id="requirement_a-clinical_assessment" codeLine="33"/><text x="179.705" y="130.667" fill="#000" font-size="20" font-family="SimSun">1</text><text x="133.74" y="172.358" fill="#000" font-size="20" textLength="40" font-family="SimSun">0..*</text></g><!--link visit_a to clinical_assessment--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk6" data-source-line="34" data-link-type="association"><path d="M372.5,103.31 C372.5,123.86 372.5,153.17 372.5,182.85" style="stroke:#000;stroke-width:1;" fill="none" id="visit_a-clinical_assessment" codeLine="34"/><text x="319.686" y="130.667" fill="#000" font-size="20" textLength="40" font-family="SimSun">0..1</text><text x="337.573" y="172.358" fill="#000" font-size="20" textLength="40" font-family="SimSun">0..*</text></g><!--link requirement_a to visit_a--><?plantuml-src ZLDDJnf16BxlhvXmgRR1M2_jmPXQaoQzc2OUUcWQix03JDpTeRDBZMrCeD44596qVg5ID5RjGVbGeiYY_1XtXkNaN-ZiZfgbCRKdXdcUztcVzvbtZIcansKYQo0aXwUY12TqPGohc83f63AXPDpZHanMy3JIeo0YguOVKM14JgZc6woRux86mGJI9XBwmuG9z0M2eK4VE4e8dXOjGohtu8F6LDamNZ_YQnoRyByuc2YGFDpe7VyhHn-LkQFzGodiMXurJO922HE-3MFTczW_i8PqRx3tI35ZOAWd31Nfq9o9Gu296SC-GCSAD60SlF2pYQnFkPSl1wKOKY088n9MeJX3BMxE00rg8KWCAIwSWq0dKw1PowdCsQsgtSZHSfQbywouQrjd0I0RO1HybPw0LmH6885w6888LbKydOXF4lWfWGZKe6vAtfGWu5GMQ3xd7AHOxPjNxUDCoc1ucFyYSsPaf5VoCpBGlGQjrhYCL-tTzzRTakn6dJONX6kF6kP1eR2iJd8O6eRRq5V6Pm0qNUMwR2_9IliilUQqjpk_5zb9gPlSl4wcsFfPTxtE3o8F2NIi7qwvwI9poyvXoZqKzrapJvSNQ2tPBUGbO3SMsT4kMzzdsoMEE-SbfxtbrFTioxARJGa4Wn9undOQj78XdBAr2zfQzbB-sItCsrT5jbJkw-Siftr95tR4jU1wrpJzYwqTqrofirNkRCwnZGhD7pXNLtmMKLQkqilLZdNOiOv5-pvXX_UuDz8lpKgzxn1u7k3cG61mOE1fuA7efBlaNSgZv5xnu0U-RWhKFn8