<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:495px;height:1044px;background:#FFFFFF;" width="495px" height="1044px" viewBox="0 0 495 1044" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--cluster M--><g class="cluster" data-qualified-name="M" id="ent0001" data-source-line="18"><path d="M8.5,6 L277.625,6 A3.75,3.75 0 0 1 280.125,8.5 L287.125,34.813 L477.5,34.813 A2.5,2.5 0 0 1 480,37.313 L480,1026.5 A2.5,2.5 0 0 1 477.5,1029 L8.5,1029 A2.5,2.5 0 0 1 6,1026.5 L6,8.5 A2.5,2.5 0 0 1 8.5,6" style="stroke:#000;stroke-width:1.5;" fill="#FFF"/><line x1="6" y1="34.813" x2="287.125" y2="34.813" style="stroke:#000;stroke-width:1.5;"/><text x="10" y="28" fill="#000" font-size="20" textLength="268.125" font-weight="700" font-family="SimSun">材料计量、批次可用性及变更</text></g><!--class material--><g class="entity" data-qualified-name="M.material" id="ent0002" data-source-line="19"><rect x="77" y="47" width="332" height="231.313" fill="#FFF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="203" y="72" fill="#000" font-size="20" textLength="80" font-style="italic" font-family="SimSun">«entity»</text><text x="223" y="94.813" fill="#000" font-size="20" textLength="40" font-family="SimSun">材料</text><line x1="78" y1="102.625" x2="408" y2="102.625" style="stroke:#181818;stroke-width:0.5;"/><text x="83" y="126.625" fill="#000" font-size="20" textLength="260" font-family="SimSun">名称、类别、规格、启用状态</text><text x="83" y="149.438" fill="#000" font-size="20" textLength="320" font-family="SimSun">基本单位、采购单位、换算分子分母</text><text x="83" y="172.25" fill="#000" font-size="20" textLength="240" font-family="SimSun">数量精度、批次及效期要求</text><text x="83" y="195.063" fill="#000" font-size="20" textLength="160" font-family="SimSun">计量确认人和时间</text><line x1="78" y1="201.875" x2="408" y2="201.875" style="stroke:#181818;stroke-width:1;"/><text x="83" y="225.875" fill="#000" font-size="20" textLength="250" font-family="SimSun">+核对单位换算及数量精度()</text><text x="83" y="248.688" fill="#000" font-size="20" textLength="210" font-family="SimSun">+确认计量设置(负责人)</text><text x="83" y="271.5" fill="#000" font-size="20" textLength="230" font-family="SimSun">+核对历史设置可修改性()</text></g><!--class material_batch--><g class="entity" data-qualified-name="M.material_batch" id="ent0003" data-source-line="29"><rect x="92" y="358" width="302" height="231.313" fill="#FFF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="203" y="383" fill="#000" font-size="20" textLength="80" font-style="italic" font-family="SimSun">«entity»</text><text x="203" y="405.813" fill="#000" font-size="20" textLength="80" font-family="SimSun">材料批次</text><line x1="93" y1="413.625" x2="393" y2="413.625" style="stroke:#181818;stroke-width:0.5;"/><text x="98" y="437.625" fill="#000" font-size="20" textLength="240" font-family="SimSun">实际批号、真实效期、来源</text><text x="98" y="460.438" fill="#000" font-size="20" textLength="280" font-family="SimSun">待检／可用／隔离／停用／过期</text><line x1="93" y1="467.25" x2="393" y2="467.25" style="stroke:#181818;stroke-width:1;"/><text x="98" y="491.25" fill="#000" font-size="20" textLength="230" font-family="SimSun">+核对同材料批号及效期()</text><text x="98" y="514.063" fill="#000" font-size="20" textLength="290" font-family="SimSun">+核对当前领用可用性(实际日期)</text><text x="98" y="536.875" fill="#000" font-size="20" textLength="250" font-family="SimSun">+放行或恢复(负责人及依据)</text><text x="98" y="559.688" fill="#000" font-size="20" textLength="150" font-family="SimSun">+立即隔离(原因)</text><text x="98" y="582.5" fill="#000" font-size="20" textLength="230" font-family="SimSun">+停用批次(负责人及依据)</text></g><!--class batch_change--><g class="entity" data-qualified-name="M.batch_change" id="ent0004" data-source-line="39"><rect x="117" y="669" width="252" height="162.875" fill="#FFF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="203" y="694" fill="#000" font-size="20" textLength="80" font-style="italic" font-family="SimSun">«entity»</text><text x="203" y="716.813" fill="#000" font-size="20" textLength="80" font-family="SimSun">批次变更</text><line x1="118" y1="724.625" x2="368" y2="724.625" style="stroke:#181818;stroke-width:0.5;"/><text x="123" y="748.625" fill="#000" font-size="20" textLength="140" font-family="SimSun">前后状态、原因</text><text x="123" y="771.438" fill="#000" font-size="20" textLength="240" font-family="SimSun">经办及确认身份、实际时间</text><line x1="118" y1="778.25" x2="368" y2="778.25" style="stroke:#181818;stroke-width:1;"/><text x="123" y="802.25" fill="#000" font-size="20" textLength="230" font-family="SimSun">+核对变更权限与原状态()</text><text x="123" y="825.063" fill="#000" font-size="20" textLength="210" font-family="SimSun">+记录状态决定及依据()</text></g><g class="entity" data-qualified-name="M.GMN7" id="ent0008" data-source-line="49"><path d="M22.5,912 L22.5,1013.25 A0,0 0 0 0 22.5,1013.25 L463.5,1013.25 A0,0 0 0 0 463.5,1013.25 L463.5,922 L453.5,912 L247,912 L243,832.16 L239,912 L22.5,912 A0,0 0 0 0 22.5,912" style="stroke:#000;stroke-width:0.5;" fill="#FFF"/><path d="M453.5,912 L453.5,922 L463.5,922 L453.5,912" style="stroke:#000;stroke-width:0.5;" fill="#FFF"/><text x="28.5" y="937" fill="#000" font-size="20" textLength="320" font-family="SimSun">形成流水后单位、换算和精度固定。</text><text x="28.5" y="959.813" fill="#000" font-size="20" textLength="420" font-family="SimSun">效期未知不默认无限，实际过期禁止普通领用。</text><text x="28.5" y="982.625" fill="#000" font-size="20" textLength="400" font-family="SimSun">助理可立即隔离，恢复或停用由负责人确认。</text><text x="28.5" y="1005.438" fill="#000" font-size="20" textLength="380" font-family="SimSun">登记批次不形成库存，退回也不自动放行。</text></g><!--link material to material_batch--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk5" data-source-line="46" data-link-type="association"><path d="M243,278.3 C243,304.3 243,331.87 243,357.86" style="stroke:#000;stroke-width:1;" fill="no