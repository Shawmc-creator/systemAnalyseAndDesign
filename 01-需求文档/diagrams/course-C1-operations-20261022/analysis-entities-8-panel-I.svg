Sun">验收状态、经办及确认时间</text><line x1="313" y1="292.25" x2="573" y2="292.25" style="stroke:#181818;stroke-width:1;"/><text x="318" y="316.25" fill="#000" font-size="20" textLength="190" font-family="SimSun">+核对已确认原采购()</text><text x="318" y="339.063" fill="#000" font-size="20" textLength="190" font-family="SimSun">+登记本次实际到货()</text><text x="318" y="361.875" fill="#000" font-size="20" textLength="250" font-family="SimSun">+确认验收结果(明细与依据)</text></g><!--class purchase_receipt_item--><g class="entity" data-qualified-name="I.purchase_receipt_item" id="ent0008" data-source-line="37"><rect x="424" y="449" width="322" height="231.313" fill="#FFF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="545" y="474" fill="#000" font-size="20" textLength="80" font-style="italic" font-family="SimSun">«entity»</text><text x="545" y="496.813" fill="#000" font-size="20" textLength="80" font-family="SimSun">验收项目</text><line x1="425" y1="504.625" x2="745" y2="504.625" style="stroke:#181818;stroke-width:0.5;"/><text x="430" y="528.625" fill="#000" font-size="20" textLength="260" font-family="SimSun">到货、合格、拒收、待检数量</text><text x="430" y="551.438" fill="#000" font-size="20" textLength="240" font-family="SimSun">批次位置、检验及差异依据</text><text x="430" y="574.25" fill="#000" font-size="20" textLength="190" font-family="SimSun">/本次新确认合格增量</text><line x1="425" y1="581.063" x2="745" y2="581.063" style="stroke:#181818;stroke-width:1;"/><text x="430" y="605.063" fill="#000" font-size="20" textLength="190" font-family="SimSun">+核对到货数量分解()</text><text x="430" y="627.875" fill="#000" font-size="20" textLength="310" font-family="SimSun">+核对材料批次位置及采购支持量()</text><text x="430" y="650.688" fill="#000" font-size="20" textLength="290" font-family="SimSun">+确认待检后续结论(保留原到货)</text><text x="430" y="673.5" fill="#000" font-size="20" textLength="210" font-family="SimSun">+计算本次应入库增量()</text></g><g class="entity" data-qualified-name="I.GMN16" id="ent0017" data-source-line="55"><path d="M467.5,760 L467.5,861.25 A0,0 0 0 0 467.5,861.25 L988.5,861.25 A0,0 0 0 0 988.5,861.25 L988.5,770 L978.5,760 L610.75,760 L606.75,680.3 L602.75,760 L467.5,760 A0,0 0 0 0 467.5,760" style="stroke:#000;stroke-width:0.5;" fill="#FFF"/><path d="M978.5,760 L978.5,770 L988.5,770 L978.5,760" style="stroke:#000;stroke-width:0.5;" fill="#FFF"/><text x="473.5" y="785" fill="#000" font-size="20" textLength="420" font-family="SimSun">到货＝合格＋拒收＋待检；到货正，其余非负。</text><text x="473.5" y="807.813" fill="#000" font-size="20" textLength="400" font-family="SimSun">待检沿用原到货记录，后续只补新合格增量。</text><text x="473.5" y="830.625" fill="#000" font-size="20" textLength="500" font-family="SimSun">验收增量、流水与余额共同保存；拒收待检不计可领量。</text><text x="473.5" y="853.438" fill="#000" font-size="20" textLength="440" font-family="SimSun">合格入库后，普通领用仍须批次已放行且未过期。</text></g><!--link order_i to purchase_receipt--><g class="link" data-entity-1="ent0002" data-entity-2="ent0007" id="lnk9" data-source-line="47" data-link-type="association"><path d="M443,103.37 C443,124.26 443,153.93 443,182.79" style="stroke:#000;stroke-width:1;" fill="none" id="order_i-purchase_receipt" codeLine="47"/><text x="432.078" y="130.738" fill="#000" font-size="20" font-family="SimSun">1</text><text x="401.344" y="172.207" fill="#000" font-size="20" textLength="40" font-family="SimSun">0..*</text></g><!--reverse link purchase_receipt to purchase_receipt_item--><g class="link" data-entity-1="ent0007" data-entity-2="ent0008" id="lnk10" data-source-line="48" data-link-type="composition"><path d="M499,381.27 C499,406.62 499,422.39 499,448.82" style="stroke:#000;stroke-width:1;" fill="none" id="purchase_receipt-backto-purchase_receipt_item" codeLine="48"/><polygon points="499,369.27,495,375.27,499,381.27,503,375.27,499,369.27" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="492.586" y="396.641" fill="#000" font-size="20" font-family="SimSun">1</text><text x="451.878" y="438.325" fill="#000" font-size="20" textLength="40" font-family=