.625" fill="#FFF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="672" y="72" fill="#000" font-size="20" textLength="80" font-style="italic" font-family="SimSun">«entity»</text><text x="672" y="94.813" fill="#000" font-size="20" textLength="80" font-family="SimSun">方案版本</text></g><!--class followup_requirement--><g class="entity" data-qualified-name="R.followup_requirement" id="ent0005" data-source-line="25"><rect x="246" y="183" width="352" height="299.75" fill="#FFF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="382" y="208" fill="#000" font-size="20" textLength="80" font-style="italic" font-family="SimSun">«entity»</text><text x="382" y="230.813" fill="#000" font-size="20" textLength="80" font-family="SimSun">诊后要求</text><line x1="247" y1="238.625" x2="597" y2="238.625" style="stroke:#181818;stroke-width:0.5;"/><text x="252" y="262.625" fill="#000" font-size="20" textLength="240" font-family="SimSun">类型、目的、目标起止日期</text><text x="252" y="285.438" fill="#000" font-size="20" textLength="240" font-family="SimSun">是否需临床评估、负责前台</text><text x="252" y="308.25" fill="#000" font-size="20" textLength="220" font-family="SimSun">要求状态、下次联系日期</text><text x="252" y="331.063" fill="#000" font-size="20" textLength="340" font-family="SimSun">发布及变更依据、完成或撤销人和时间</text><line x1="247" y1="337.875" x2="597" y2="337.875" style="stroke:#181818;stroke-width:1;"/><text x="252" y="361.875" fill="#000" font-size="20" textLength="210" font-family="SimSun">+核对患者与诊疗来源()</text><text x="252" y="384.688" fill="#000" font-size="20" textLength="170" font-family="SimSun">+暂存或发布要求()</text><text x="252" y="407.5" fill="#000" font-size="20" textLength="210" font-family="SimSun">+调整未完成要求(原因)</text><text x="252" y="430.313" fill="#000" font-size="20" textLength="190" font-family="SimSun">+撤销要求(牙医依据)</text><text x="252" y="453.125" fill="#000" font-size="20" textLength="270" font-family="SimSun">+安排继续跟进(日期与责任人)</text><text x="252" y="475.938" fill="#000" font-size="20" textLength="250" font-family="SimSun">+核对目的达成及完成依据()</text></g><g class="entity" data-qualified-name="R.GMN11" id="ent0012" data-source-line="44"><path d="M181.5,563 L181.5,641.438 A0,0 0 0 0 181.5,641.438 L662.5,641.438 A0,0 0 0 0 662.5,641.438 L662.5,573 L652.5,563 L426,563 L422,483.23 L418,563 L181.5,563 A0,0 0 0 0 181.5,563" style="stroke:#000;stroke-width:0.5;" fill="#FFF"/><path d="M652.5,563 L652.5,573 L662.5,573 L652.5,563" style="stroke:#000;stroke-width:0.5;" fill="#FFF"/><text x="187.5" y="588" fill="#000" font-size="20" textLength="400" font-family="SimSun">来源就诊或方案版本至少一项，均属本患者。</text><text x="187.5" y="610.813" fill="#000" font-size="20" textLength="460" font-family="SimSun">发布仅产生待办；未联系、拒绝、未到不自动完成。</text><text x="187.5" y="633.625" fill="#000" font-size="20" textLength="420" font-family="SimSun">调整及撤销保留原历史，不直接取消既有预约。</text></g><!--link patient_r to followup_requirement--><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" id="lnk6" data-source-line="38" data-link-type="association"><path d="M242.28,85 C263.36,85 279,85 279,85 C279,85 279,130.58 279,182.66" style="stroke:#000;stroke-width:1;" fill="none" id="patient_r-followup_requirement" codeLine="38"/><text x="250.025" y="82.973" fill="#000" font-size="20" font-family="SimSun">1</text><text x="230.595" y="172.368" fill="#000" font-size="20" textLength="40" font-family="SimSun">0..*</text></g><!--link visit_r to followup_requirement--><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" id="lnk7" data-source-line="39" data-link-type="association"><path d="M422,103.1 C422,123.28 422,152.21 422,182.78" style="stroke:#000;stroke-width:1;" fill="none" id="visit_r-followup_requirement" codeLine="39"/><text x="378.188" y="130.667" fill="#000" font-size="20" textLength="40" font-family="SimSun">0..1</text><text x="380.906" y="171.992" fill="#000" font-size="20" textLength="40" font-family="SimSun">0..*</text></g><!--link plan_r to followup_requirement--><g class="link" data-entity-1="