;stroke-width:1.5;"/><text x="1460" y="28" fill="#000" font-size="20" textLength="185.625" font-weight="700" font-family="SimSun">牙医评估与完成条件</text></g><!--class patient_r--><g class="entity" data-qualified-name="R.patient_r" id="ent0002" data-source-line="20"><rect x="22" y="47" width="220" height="55.625" fill="#FFF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="92" y="72" fill="#000" font-size="20" textLength="80" font-style="italic" font-family="SimSun">«entity»</text><text x="112" y="94.813" fill="#000" font-size="20" textLength="40" font-family="SimSun">患者</text></g><!--class visit_r--><g class="entity" data-qualified-name="R.visit_r" id="ent0003" data-source-line="22"><rect x="312" y="47" width="220" height="55.625" fill="#FFF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="382" y="72" fill="#000" font-size="20" textLength="80" font-style="italic" font-family="SimSun">«entity»</text><text x="402" y="94.813" fill="#000" font-size="20" textLength="40" font-family="SimSun">就诊</text></g><!--class plan_r--><g class="entity" data-qualified-name="R.plan_r" id="ent0004" data-source-line="24"><rect x="602" y="47" width="220" height="55.625" fill="#FFF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="672" y="72" fill="#000" font-size="20" textLength="80" font-style="italic" font-family="SimSun">«entity»</text><text x="672" y="94.813" fill="#000" font-size="20" textLength="80" font-family="SimSun">方案版本</text></g><!--class followup_requirement--><g class="entity" data-qualified-name="R.followup_requirement" id="ent0005" data-source-line="25"><rect x="246" y="183" width="352" height="322.563" fill="#FFF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="382" y="208" fill="#000" font-size="20" textLength="80" font-style="italic" font-family="SimSun">«entity»</text><text x="382" y="230.813" fill="#000" font-size="20" textLength="80" font-family="SimSun">诊后要求</text><line x1="247" y1="238.625" x2="597" y2="238.625" style="stroke:#181818;stroke-width:0.5;"/><text x="252" y="262.625" fill="#000" font-size="20" textLength="180" font-family="SimSun">来源门店、负责门店</text><text x="252" y="285.438" fill="#000" font-size="20" textLength="240" font-family="SimSun">类型、目的、目标起止日期</text><text x="252" y="308.25" fill="#000" font-size="20" textLength="240" font-family="SimSun">是否需临床评估、负责前台</text><text x="252" y="331.063" fill="#000" font-size="20" textLength="220" font-family="SimSun">要求状态、下次联系日期</text><text x="252" y="353.875" fill="#000" font-size="20" textLength="340" font-family="SimSun">发布及变更依据、完成或撤销人和时间</text><line x1="247" y1="360.688" x2="597" y2="360.688" style="stroke:#181818;stroke-width:1;"/><text x="252" y="384.688" fill="#000" font-size="20" textLength="210" font-family="SimSun">+核对患者与诊疗来源()</text><text x="252" y="407.5" fill="#000" font-size="20" textLength="170" font-family="SimSun">+暂存或发布要求()</text><text x="252" y="430.313" fill="#000" font-size="20" textLength="210" font-family="SimSun">+调整未完成要求(原因)</text><text x="252" y="453.125" fill="#000" font-size="20" textLength="190" font-family="SimSun">+撤销要求(牙医依据)</text><text x="252" y="475.938" fill="#000" font-size="20" textLength="270" font-family="SimSun">+安排继续跟进(日期与责任人)</text><text x="252" y="498.75" fill="#000" font-size="20" textLength="250" font-family="SimSun">+核对目的达成及完成依据()</text></g><g class="entity" data-qualified-name="R.GMN11" id="ent0012" data-source-line="45"><path d="M181.5,586 L181.5,664.438 A0,0 0 0 0 181.5,664.438 L662.5,664.438 A0,0 0 0 0 662.5,664.438 L662.5,596 L652.5,586 L426,586 L422,506.04 L418,586 L181.5,586 A0,0 0 0 0 181.5,586" style="stroke:#000;stroke-width:0.5;" fill="#FFF"/><path d="M652.5,586 L652.5,596 L662.5,596 L652.5,586" style="stroke:#000;stroke-width:0.5;" fill="#FFF"/><text x="187.5" y="611" fill="#000" font-size="20" textLength="400" font-family="SimSun">来源就诊或方案版本至少一项，均属本患者。</text><text x="187.5" y="633.813" fill="#000" font-size="20" textLength="460" font-family="SimSun">发布仅产生待办；未联系、拒绝、未到不自动完成。</text><text x="187.5" y="656.625" fill="#000" font-size="20" textLength="420" font-family="SimSun">调整及撤销保留原历史，不直接取消既有预约。</text></g><!--class requirement_c--><g class="entity" data-qualified-name="C.requirement_c" id="ent0015" data-source-line="52"><rect x="892" y="47" width="220" height="55.625" fill="#FFF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="962" y="72" fill="#000" font-size="20" textLength="80" font-style="italic" font-family="SimSun">«entity»</text><text x="962" y="94.813" fill="#000" font-size="20" textLength="80" font-family="SimSun">诊后要求</text></g><!--class appointment_c--><g class="entity" data-qualified-name="C.appointment_c" id="ent0016" data-source-line="54"><rect x="1182" y="47" width="220" height="55.625" fill="#FFF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1252" y="72" fill="#000" font-size="20" textLength="80" font-style="italic" font-family="SimSun">«entity»</text><text x="1272" y="94.813" fill="#000" font-size="20" textLength="40" font-family="SimSun">预约</text></g><!--class contact_history--><g class="entity" data-qualified-name="C.contact_history" id="ent0017" data-source-line="55"><rect x="1011" y="229" width="272" height="231.313" fill="#FFF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1107" y="254" fill="#000" font-size="20" textLength="80" font-style="italic" font-family="SimSun">«entity»</text><text x="1107" y="276.813" fill="#000" font-size="20" textLength="80" font-family="SimSun">联系经历</text><line x1="1012" y1="284.625" x2="1282" y2="284.625" style="stroke:#181818;stroke-width:0.5;"/><text x="1017" y="308.625" fill="#000" font-size="20" textLength="80" font-family="SimSun">实际门店</text><text x="1017" y="331.438" fill="#000" font-size="20" textLength="200" font-family="SimSun">实际方式、时间、前台</text><text x="1017" y="354.25" fill="#000" font-size="20" textLength="260" font-family="SimSun">沟通事实、结果、下次联系日</text><line x1="1012" y1="361.063" x2="1282" y2="361.063" style="stroke:#181818;stroke-width:1;"/><text x="1017" y="385.063" fill="#000" font-size="20" textLength="190" font-family="SimSun">+记录实际联系结果()</text><text x="1017" y="407.875" fill="#000" font-size="20" textLength="190" font-family="SimSun">+核对成功预约归属()</text><text x="1017" y="430.688" fill="#000" font-size="20" textLength="190" font-family="SimSun">+关联既有成功预约()</text><text x="1017" y="453.5" fill="#000" font-size="20" textLength="190" font-family="SimSun">+记录继续联系(日期)</text></g><g class="entity" data-qualified-name="C.GMN21" id="ent0022" data-source-line="69"><path d="M916.5,586 L916.5,664.438 A0,0 0 0 0 916.5,664.438 L1377.5,664.438 A0,0 0 0 0 1377.5,664.438 L1377.5,596 L1367.5,586 L1151,586 L1147,460.21 L1143,586 L916.5,586 A0,0 0 0 0 916.5,586" style="stroke:#000;stroke-width:0.5;" fill="#FFF"/><path d="M1367.5,586 L1367.5,596 L1377.5,596 L1367.5,586" style="stroke:#000;stroke-width:0.5;" fill="#FFF"/><text x="922.5" y="611" fill="#000" font-size="20" textLength="360" font-family="SimSun">实际联系、预约、到诊和评估分别记录。</text><text x="922.5" y="633.813" fill="#000" font-size="20" textLength="340" font-family="SimSun">预约失败仍保存联系；不自动建预约。</text><text x="922.5" y="656.625" fill="#000" font-size="20" textLength="440" font-family="SimSun">需评估交牙医；免评估完成仍核对真实目的达成。</text></g><!--class requirement_a--><g class="entity" data-qualified-name="A.requirement_a" id="ent0025" data-source-line="76"><rect x="1472" y="47" width="220" height="55.625" fill="#FFF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1542" y="72" fill="#000" font-size="20" textLength="80" font-style="italic" font-family="SimSun">«entity»</text><text x="1542" y="94.813" fill="#000" font-size="20" textLength="80" font-family="SimSun">诊后要求</text></g><!--class visit_a--><g class="entity" data-qualified-name="A.visit_a" id="ent0026" data-source-line="78"><rect x="1762" y="47" width="220" height="55.625" fill="#FFF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1832" y=