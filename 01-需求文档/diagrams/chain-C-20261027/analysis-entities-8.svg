</text></g><!--class supplier--><g class="entity" data-qualified-name="O.supplier" id="ent0003" data-source-line="21"><rect x="177" y="47" width="252" height="140.063" fill="#FFF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="263" y="72" fill="#000" font-size="20" textLength="80" font-style="italic" font-family="SimSun">«entity»</text><text x="273" y="94.813" fill="#000" font-size="20" textLength="60" font-family="SimSun">供应商</text><line x1="178" y1="102.625" x2="428" y2="102.625" style="stroke:#181818;stroke-width:0.5;"/><text x="183" y="126.625" fill="#000" font-size="20" textLength="240" font-family="SimSun">名称、联系人、电话、地址</text><text x="183" y="149.438" fill="#000" font-size="20" textLength="80" font-family="SimSun">启用状态</text><line x1="178" y1="156.25" x2="428" y2="156.25" style="stroke:#181818;stroke-width:1;"/><text x="183" y="180.25" fill="#000" font-size="20" textLength="210" font-family="SimSun">+核对供方及联系资料()</text></g><!--class purchase_order--><g class="entity" data-qualified-name="O.purchase_order" id="ent0004" data-source-line="27"><rect x="312" y="267" width="292" height="254.125" fill="#FFF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="418" y="292" fill="#000" font-size="20" textLength="80" font-style="italic" font-family="SimSun">«entity»</text><text x="438" y="314.813" fill="#000" font-size="20" textLength="40" font-family="SimSun">采购</text><line x1="313" y1="322.625" x2="603" y2="322.625" style="stroke:#181818;stroke-width:0.5;"/><text x="318" y="346.625" fill="#000" font-size="20" textLength="80" font-family="SimSun">所属门店</text><text x="318" y="369.438" fill="#000" font-size="20" textLength="180" font-family="SimSun">需求依据、交付约定</text><text x="318" y="392.25" fill="#000" font-size="20" textLength="220" font-family="SimSun">待确认／已确认／已取消</text><text x="318" y="415.063" fill="#000" font-size="20" textLength="280" font-family="SimSun">提出及确认人、时间、取消原因</text><line x1="313" y1="421.875" x2="603" y2="421.875" style