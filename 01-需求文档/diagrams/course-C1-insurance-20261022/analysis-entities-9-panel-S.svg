<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:1299px;height:799px;background:#FFFFFF;" width="1299px" height="799px" viewBox="0 0 1299 799" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--cluster S--><g class="cluster" data-qualified-name="S" id="ent0001" data-source-line="18"><path d="M8.5,6 L318.875,6 A3.75,3.75 0 0 1 321.375,8.5 L328.375,34.813 L1281.5,34.813 A2.5,2.5 0 0 1 1284,37.313 L1284,781.5 A2.5,2.5 0 0 1 1281.5,784 L8.5,784 A2.5,2.5 0 0 1 6,781.5 L6,8.5 A2.5,2.5 0 0 1 8.5,6" style="stroke:#000;stroke-width:1.5;" fill="#FFF"/><line x1="6" y1="34.813" x2="328.375" y2="34.813" style="stroke:#000;stroke-width:1.5;"/><text x="10" y="28" fill="#000" font-size="20" textLength="309.375" font-weight="700" font-family="SimSun">正式结算、原单撤销及实际结算款</text></g><!--class case_s--><g class="entity" data-qualified-name="S.case_s" id="ent0002" data-source-line="20"><rect x="437.5" y="47" width="225" height="55.625" fill="#FFF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="510" y="72" fill="#000" font-size="20" textLength="80" font-style="italic" font-family="SimSun">«entity»</text><text x="490" y="94.813" fill="#000" font-size="20" textLength="120" font-family="SimSun">医保就诊办理</text></g><!--class request_s--><g class="entity" data-qualified-name="S.request_s" id="ent0003" data-source-line="22"><rect x="65.5" y="292" width="225" height="55.625" fill="#FFF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="138" y="317" fill="#000" font-size="20" textLength="80" font-style="italic" font-family="SimSun">«entity»</text><text x="138" y="339.813" fill="#000" font-size="20" textLength="80" font-family="SimSun">费用申请</text></g><!--class insurance_settlement--><g class="entity" data-qualified-name="S.insurance_settlement" id="ent0004" data-source-line="23"><rect x="399" y="193" width="302" height="254.125" fill="#FFF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="510" y="218" fill="#000" font-size="20" textLength="80" font-style="italic" font-family="SimSun">«entity»</text><text x="510" y="240.813" fill="#000" font-size="20" textLength="80" font-family="SimSun">医保结算</text><line x1="400" y1="248.625" x2="700" y2="248.625" style="stroke:#181818;stroke-width:0.5;"/><text x="405" y="272.625" fill="#000" font-size="20" textLength="230" font-family="SimSun">正式结算号、范围内总费T</text><text x="405" y="295.438" fill="#000" font-size="20" textLength="230" font-family="SimSun">基金F、个账A、其他自付P</text><text x="405" y="318.25" fill="#000" font-size="20" textLength="260" font-family="SimSun">有效／已撤销、实际确认时间</text><text x="405" y="341.063" fill="#000" font-size="20" textLength="290" font-family="SimSun">/应拨额、/净到账、/待收或待退</text><line x1="400" y1="347.875" x2="700" y2="347.875" style="stroke:#181818;stroke-width:1;"/><text x="405" y="371.875" fill="#000" font-size="20" textLength="250" font-family="SimSun">+核对明确正式结果及分摊()</text><text x="405" y="394.688" fill="#000" font-size="20" textLength="190" font-family="SimSun">+确认有效正式结算()</text><text x="405" y="417.5" fill="#000" font-size="20" textLength="230" font-family="SimSun">+按成功撤销停用原结算()</text><text x="405" y="440.313" fill="#000" font-size="20" textLength="290" font-family="SimSun">+计算应拨及收退差额(实际收付)</text></g><!--class insurance_reversal--><g class="entity" data-qualified-name="S.insurance_reversal" id="ent0005" data-source-line="34"><rect x="22" y="537" width="312" height="231.313" fill="#FFF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="138" y="562" fill="#000" font-size="20" textLength="80" font-style="italic" font-family="SimSun">«entity»</text><text x="118" y="584.813" fill="#000" font-size="20" textLength="120" font-family="SimSun">医保撤销办理</text><line x1="23" y1="592.625" x2="333" y2="592.625" style="stroke:#181818;stroke-width:0.5;"/><text x="28" y="616.625" fill="#000" font-size="20" textLength="280" font-family="SimSun">唯一撤销号、原因及负责人依据</text><text x="28" y="639.438" fill="#000" font-size="20" textLength="300" font-family="SimSun">待办理／待核实／已成功／已失败</text><text x="28" y="662.25" fill="#000" font-size="20" textLength="220" font-family="SimSun">原笔结果、核实人及时间</text><line x1="23" y1="669.063" x2="333" y2="669.063" style="stroke:#181818;stroke-width:1;"/><text x="28" y="693.063" fill="#000" font-size="20" textLength="230" font-family="SimSun">+核对原结算及批准依据()</text><text x="28" y="715.875" fill="#000" font-size="20" textLength="190" font-family="SimSun">+建立原单撤销待办()</text><text x="28" y="738.688" fill="#000" font-size="20" textLength="290" font-family="SimSun">+保留未知或失败结果(真实依据)</text><text x="28" y="761.5" fill="#000" font-size="20" textLength="190" font-family="SimSun">+确认平台撤销成功()</text></g><!--class insurance_fund_receipt--><g class="entity" data-qualified-name="S.insurance_fund_receipt" id="ent0006" data-source-line="44"><rect x="409" y="548.5" width="282" height="208.5" fill="#FFF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="510" y="573.5" fill="#000" font-size="20" textLength="80" font-style="italic" font-family="SimSun">«entity»</text><text x="480" y="596.313" fill="#000" font-size="20" textLength="140" font-family="SimSun">医保结算款收付</text><line x1="410" y1="604.125" x2="690" y2="604.125" style="stroke:#181818;stroke-width:0.5;"/><text x="415" y="628.125" fill="#000" font-size="20" textLength="220" font-family="SimSun">拨付或退回、实际正金额</text><text x="415" y="650.938" fill="#000" font-size="20" textLength="240" font-family="SimSun">实际时间、医保或银行凭据</text><text x="415" y="673.75" fill="#000" font-size="20" textLength="80" font-family="SimSun">经办人员</text><line x1="410" y1="680.563" x2="690" y2="680.563" style="stroke:#181818;stroke-width:1;"/><text x="415" y="704.563" fill="#000" font-size="20" textLength="270" font-family="SimSun">+核对原结算及实际收付依据()</text><text x="415" y="727.375" fill="#000" font-size="20" textLength="250" font-family="SimSun">+核对重复收付(原单及凭据)</text><text x="415" y="750.188" fill="#000" font-size="20" textLength="210" font-family="SimSun">+记录实际拨付或退回()</text></g><g class="entity" data-qualified-name="S.GMN12" id="ent0013" data-source-line="59"><path d="M766.5,579 L766.5,725.875 L1267.5,725.875 L1267.5,589 L1257.5,579 L766.5,579" style="stroke:#000;stroke-width:0.5;" fill="#FFF"/><path d="M1257.5,579 L1257.5,589 L1267.5,589 L1257.5,579" style="stroke:#000;stroke-width:1;" fill="#FFF"/><text x="772.5" y="604" fill="#000" font-size="20" textLength="440" font-family="SimSun">T＝F＋A＋P，均非负；正式结果与预估分开保存。</text><text x="772.5" y="626.813" fill="#000" font-size="20" textLength="440" font-family="SimSun">同一费用不重复有效结算；未知或未决先查原号。</text><text x="772.5" y="649.625" fill="#000" font-size="20" textLength="410" font-family="SimSun">撤销成功才改变原结算，患者退款另按UC-14。</text><text x="772.5" y="672.438" fill="#000" font-size="20" textLength="350" font-family="SimSun">有效结算应拨＝F＋A，已撤销应拨＝0；</text><text x="772.5" y="695.25" fill="#000" font-size="20" textLength="480" font-family="SimSun">净到账＝实际拨付－实际退回，差额＝应拨－净到账。</text><text x="772.5" y="718.063" fill="#000" font-size="20" textLength="460" font-family="SimSun">差额正为待收、负为待退，不能自动转成患者欠费。</text></g><!--link case_s to insurance_settlement--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk7" data-source-line="53" data-link-type="association"><path d="M550,103.1 C550,125.67 550,159.07 550,192.93" style="stroke:#000;stroke-width:1;" fill="none" id="case_s-insurance_settlement" codeLine="53"/><text x="539.047" y="130.667" fill="#000" font-size="20" font-family="SimSun">1</text><text x="508.719" y="182.107" fill="#000" font-size="20" textLength="40" font-family="SimSun">0..*</text></g><!--link insurance_settlement to insurance_reversal--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk8" data-source-line="54" data-link-type="association"><path d="M404,447.13 C404,497.21 404,543 404,543 C404,543 373.04,543