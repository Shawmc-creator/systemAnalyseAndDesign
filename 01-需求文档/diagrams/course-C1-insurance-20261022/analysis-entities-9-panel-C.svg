<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:1479px;height:715px;background:#FFFFFF;" width="1479px" height="715px" viewBox="0 0 1479 715" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--cluster C--><g class="cluster" data-qualified-name="C" id="ent0001" data-source-line="18"><path d="M8.5,6 L215.75,6 A3.75,3.75 0 0 1 218.25,8.5 L225.25,34.813 L1461.5,34.813 A2.5,2.5 0 0 1 1464,37.313 L1464,697.5 A2.5,2.5 0 0 1 1461.5,700 L8.5,700 A2.5,2.5 0 0 1 6,697.5 L6,8.5 A2.5,2.5 0 0 1 8.5,6" style="stroke:#000;stroke-width:1.5;" fill="#FFF"/><line x1="6" y1="34.813" x2="225.25" y2="34.813" style="stroke:#000;stroke-width:1.5;"/><text x="10" y="28" fill="#000" font-size="20" textLength="206.25" font-weight="700" font-family="SimSun">预结算办理及患者选择</text></g><!--class patient_c--><g class="entity" data-qualified-name="C.patient_c" id="ent0002" data-source-line="20"><rect x="622.5" y="47" width="225" height="55.625" fill="#FFF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="695" y="72" fill="#000" font-size="20" textLength="80" font-style="italic" font-family="SimSun">«entity»</text><text x="715" y="94.813" fill="#000" font-size="20" textLength="40" font-family="SimSun">患者</text></g><!--class visit_c--><g class="entity" data-qualified-name="C.visit_c" id="ent0003" data-source-line="22"><rect x="922.5" y="47" width="225" height="55.625" fill="#FFF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="995" y="72" fill="#000" font-size="20" textLength="80" font-style="italic" font-family="SimSun">«entity»</text><text x="1015" y="94.813" fill="#000" font-size="20" textLength="40" font-family="SimSun">就诊</text></g><!--class bill_c--><g class="entity" data-qualified-name="C.bill_c" id="ent0004" data-source-line="24"><rect x="1222.5" y="47" width="225" height="55.625" fill="#FFF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="1295" y="72" fill="#000" font-size="20" textLength="80" font-style="italic" font-family="SimSun">«entity»</text><text x="1295" y="94.813" fill="#000" font-size="20" textLength="80" font-family="SimSun">应收账目</text></g><!--class identity_c--><g class="entity" data-qualified-name="C.identity_c" id="ent0005" data-source-line="26"><rect x="322.5" y="47" width="225" height="55.625" fill="#FFF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="395" y="72" fill="#000" font-size="20" textLength="80" font-style="italic" font-family="SimSun">«entity»</text><text x="375" y="94.813" fill="#000" font-size="20" textLength="120" font-family="SimSun">医保身份核验</text></g><!--class previous_case_c--><g class="entity" data-qualified-name="C.previous_case_c" id="ent0006" data-source-line="28"><rect x="22.5" y="47" width="225" height="55.625" fill="#FFF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="95" y="72" fill="#000" font-size="20" textLength="80" font-style="italic" font-family="SimSun">«entity»</text><text x="75" y="94.813" fill="#000" font-size="20" textLength="120" font-family="SimSun">医保就诊办理</text></g><!--class insurance_case--><g class="entity" data-qualified-name="C.insurance_case" id="ent0007" data-source-line="29"><rect x="584" y="193" width="302" height="299.75" fill="#FFF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="695" y="218" fill="#000" font-size="20" textLength="80" font-style="italic" font-family="SimSun">«entity»</text><text x="675" y="240.813" fill="#000" font-size="20" textLength="120" font-family="SimSun">医保就诊办理</text><line x1="585" y1="248.625" x2="885" y2="248.625" style="stroke:#181818;stroke-width:0.5;"/><text x="590" y="272.625" fill="#000" font-size="20" textLength="260" font-family="SimSun">唯一业务号、机构及诊断标识</text><text x="590" y="295.438" fill="#000" font-size="20" textLength="280" font-family="SimSun">费用版本、办理状态及结果依据</text><text x="590" y="318.25" fill="#000" font-size="20" textLength="240" font-family="SimSun">预估基金／个账／其他自付</text><text x="590" y="341.063" fill="#000" font-size="20" textLength="180" font-family="SimSun">患者选择及确认时间</text><line x1="585" y1="347.875" x2="885" y2="347.875" style="stroke:#181818;stroke-width:1;"/><text x="590" y="371.875" fill="#000" font-size="20" textLength="290" font-family="SimSun">+核对患者就诊身份及账目归属()</text><text x="590" y="394.688" fill="#000" font-size="20" textLength="290" font-family="SimSun">+核对本次费用范围及适用条件()</text><text x="590" y="417.5" fill="#000" font-size="20" textLength="270" font-family="SimSun">+保存预估分摊(平台实际结果)</text><text x="590" y="440.313" fill="#000" font-size="20" textLength="230" font-family="SimSun">+使旧预估失效(变更依据)</text><text x="590" y="463.125" fill="#000" font-size="20" textLength="190" font-family="SimSun">+记录患者实际选择()</text><text x="590" y="485.938" fill="#000" font-size="20" textLength="250" font-family="SimSun">+建立重新办理(原办理依据)</text></g><g class="entity" data-qualified-name="C.GMN15" id="ent0016" data-source-line="50"><path d="M454.5,583 L454.5,684.25 A0,0 0 0 0 454.5,684.25 L1015.5,684.25 A0,0 0 0 0 1015.5,684.25 L1015.5,593 L1005.5,583 L739,583 L735,493.36 L731,583 L454.5,583 A0,0 0 0 0 454.5,583" style="stroke:#000;stroke-width:0.5;" fill="#FFF"/><path d="M1005.5,583 L1005.5,593 L1015.5,593 L1005.5,583" style="stroke:#000;stroke-width:0.5;" fill="#FFF"/><text x="460.5" y="608" fill="#000" font-size="20" textLength="540" font-family="SimSun">同一提交范围：总费＝预估基金＋个账＋其他自付，均非负。</text><text x="460.5" y="630.813" fill="#000" font-size="20" textLength="500" font-family="SimSun">范围外自费另列；预估不抵最终待付，也不算正式到账。</text><text x="460.5" y="653.625" fill="#000" font-size="20" textLength="460" font-family="SimSun">费用版本或适用条件变化，原预估失效并保留依据。</text><text x="460.5" y="676.438" fill="#000" font-size="20" textLength="520" font-family="SimSun">患者选择医保后才能正式结算，未决定或自费不自动结算。</text></g><!--link patient_c to insurance_case--><g class="link" data-entity-1="ent0002" data-entity-2="ent0007" id="lnk8" data-source-line="42" data-link-type="association"><path d="M735,103.17 C735,125.42 735,158.34 735,192.71" style="stroke:#000;stroke-width:1;" fill="none" id="patient_c-insurance_case" codeLine="42"/><text x="724.078" y="130.501" fill="#000" font-size="20" font-family="SimSun">1</text><text x="693.969" y="182.421" fill="#000" font-size="20" textLength="40" font-family="SimSun">0..*</text></g><!--link visit_c to insurance_case--><g class="link" data-entity-1="ent0003" data-entity-2="ent0007" id="lnk9" data-source-line="43" data-link-type="association"><path d="M922.31,85 C891.66,85 866.75,85 866.75,85 C866.75,85 866.75,136.16 866.75,192.92" style="stroke:#000;stroke-width:1;" fill="none" id="visit_c-insurance_case" codeLine="43"/><text x="904.403" y="82.973" fill="#000" font-size="20" font-family="SimSun">1</text><text x="832.861" y="182.14" fill="#000" font-size="20" textLength="40" font-family="SimSun">0..*</text></g><!--link bill_c to insurance_case--><g class="link" data-entity-1="ent0004" data-entity-2="ent0007" id="lnk10" data-source-line="44" data-link-type="association"><path d="M1335,103.17 C1335,171.98 1335,343 1335,343 C1335,343 1063.76,343 886.02,343" style="stroke:#000;stroke-width:1;" fill="none" id="bill_c-insurance_case" codeLine="44"/><text x="1291.313" y="130.501" fill="#000" font-size="20" textLength="40" font-family="SimSun">0..1</text><text x="893.769" y="340.526" fill="#000" font-size="20" textLength="40" font-family="SimSun">0..*</text></g><!--link identity_c to insurance_case--><g class="link" data-entity-1="ent0005" data-entity-2="ent0007" id="lnk11" data-source-line="45" data-link-type="association"><path d="M547.69,75 C578.34,75 603.25,75 603.25,75 C603.25,75 603.25,131.7 603.25,192.94" style="stroke:#000;stroke-width:1;" fill="none" id="identity_c-insurance_case" codeLine="45"/><text x="555.361" y="72.398" fill="#000" font-size="20" textLength="40" font-family="SimSun">0..1</text><text x="554.9