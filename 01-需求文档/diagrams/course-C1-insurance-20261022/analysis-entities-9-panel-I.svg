h="225" height="55.625" fill="#FFF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="695" y="72" fill="#000" font-size="20" textLength="80" font-style="italic" font-family="SimSun">«entity»</text><text x="715" y="94.813" fill="#000" font-size="20" textLength="40" font-family="SimSun">材料</text></g><!--class insurance_identity--><g class="entity" data-qualified-name="I.insurance_identity" id="ent0005" data-source-line="25"><rect x="22" y="193" width="302" height="185.688" fill="#FFF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="133" y="218" fill="#000" font-size="20" textLength="80" font-style="italic" font-family="SimSun">«entity»</text><text x="113" y="240.813" fill="#000" font-size="20" textLength="120" font-family="SimSun">医保身份核验</text><line x1="23" y1="248.625" x2="323" y2="248.625" style="stroke:#181818;stroke-width:0.5;"/><text x="28" y="272.625" fill="#000" font-size="20" textLength="220" font-family="SimSun">必要人员编号、参保地区</text><text x="28" y="295.438" fill="#000" font-size="20" textLength="260" font-family="SimSun">实际核验结果、时刻及适用期</text><text x="28" y="318.25" fill="#000" font-size="20" textLength="180" font-family="SimSun">办理人员、结果依据</text><line x1="23" y1="325.063" x2="323" y2="325.063" style="stroke:#181818;stroke-width:1;"/><text x="28" y="349.063" fill="#000" font-size="20" textLength="250" font-family="SimSun">+核对患者及核验适用条件()</text><text x="28" y="371.875" fill="#000" font-size="20" textLength="290" font-family="SimSun">+记录明确核验结果(原办理依据)</text></g><!--class insurance_item_mapping--><g class="entity" data-qualified-name="I.insurance_item_mapping" id="ent0006" data-source-line="33"><rect x="412" y="204.5" width="262" height="162.875" fill="#FFF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="503" y="229.5" fill="#000" font-size="20" textLength="80" font-style="italic" font-family="SimSun">«entity»</text><text x="483" y="252.313" fill="#000" font-size="20" textLength="120" font-family="SimSun">医保项目对应</text><line x1="413" y1="260.125" x2="673" y2="260.125" style="stroke:#181818;stroke-width:0.5;"/><text x="418" y="284.125" fill="#000" font-size="20" textLength="240" font-family="SimSun">地区、适用编码及起止日期</text><text x="418" y="306.938" fill="#000" font-size="20" textLength="140" font-family="SimSun">有效或停用状态</text><line x1="413" y1="313.75" x2="673" y2="313.75" style="stroke:#181818;stroke-width:1;"/><text x="418" y="337.75" fill="#000" font-size="20" textLength="250" font-family="SimSun">+核对项目或药品唯一归属()</text><text x="418" y="360.563" fill="#000" font-size="20" textLength="250" font-family="SimSun">+核对本地区及日期适用性()</text></g><g class="entity" data-qualified-name="I.GMN11" id="ent0012" data-source-line="45"><path d="M252.5,469 L252.5,570.25 A0,0 0 0 0 252.5,570.25 L833.5,570.25 A0,0 0 0 0 833.5,570.25 L833.5,479 L823.5,469 L547,469 L543,367.67 L539,469 L252.5,469 A0,0 0 0 0 252.5,469" style="stroke:#000;stroke-width:0.5;" fill="#FFF"/><path d="M823.5,469 L823.5,479 L833.5,479 L823.5,469" style="stroke:#000;stroke-width:0.5;" fill="#FFF"/><text x="258.5" y="494" fill="#000" font-size="20" textLength="560" font-family="SimSun">编码对应收费项目或药品恰选其一；核验通过不等于全部可报。</text><text x="258.5" y="516.813" fill="#000" font-size="20" textLength="420" font-family="SimSun">核验及编码按地区、日期和真实平台结果核对。</text><text x="258.5" y="539.625" fill="#000" font-size="20" textLength="520" font-family="SimSun">资料不全或核验未知保留原办理，不补造通过或医保编码。</text><text x="258.5" y="562.438" fill="#000" font-size="20" textLength="460" font-family="SimSun">仅保留必要核验结果，不保存一次性原始认证凭证。</text></g><!--link patient_i to insurance_identity--><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" id="lnk7" data-source-line="40" data-link-type="association"><path d="M135,103.02 C135,126.11 135,160.24 135,192.79" style="stroke:#000;stroke-width:1;" fill="none" id="patient_i-insurance_identity" codeLine="40"/><text x="124.047" y="130.571" fill="#000" font-size="20" font-family="SimSun">1</text><text x="90.197" y="182.207" fill="#000" fo