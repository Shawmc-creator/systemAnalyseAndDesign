="SimSun">受理、截图或金额相似不代表到账成功；</text><text x="158.5" y="945.625" fill="#000" font-size="20" textLength="380" font-family="SimSun">差异处理引用原办理，不补造收款或退款。</text></g><!--link funds_e to payment_order--><g class="link" data-entity-1="ent0002" data-entity-2="ent0006" id="lnk8" data-source-line="45" data-link-type="association"><path d="M265.05,85 C286.67,85 303,85 303,85 C303,85 303,130.48 303,177.73" style="stroke:#000;stroke-width:1;" fill="none" id="funds_e-payment_order" codeLine="45"/><text x="273.132" y="82.97" fill="#000" font-size="20" font-family="SimSun">1</text><text x="253.159" y="167.276" fill="#000" font-size="20" textLength="40" font-family="SimSun">0..*</text></g><!--link bill_e to payment_order--><g class="link" data-entity-1="ent0003" data-entity-2="ent0006" id="lnk9" data-source-line="46" data-link-type="association"><path d="M435,103.35 C435,122.95 435,150.35 435,177.81" style="stroke:#000;stroke-width:1;" fill="none" id="bill_e-payment_order" codeLine="46"/><text x="391.313" y="130.715" fill="#000" font-size="20" textLength="40" font-family="SimSun">0..1</text><text x="394.853" y="167.362" fill="#000" font-size="20" textLength="40" font-family="SimSun">0..*</text></g><!--link payment_order to payment_e--><g class="link" data-entity-1="ent0006" data-entity-2="ent0004" id="lnk10" data-source-line="47" data-link-type="association"><path d="M402,386.11 C402,413.69 402,441.22 402,460.85" style="stroke:#000;stroke-width:1;" fill="none" id="payment_order-payment_e" codeLine="47"/><text x="359.43" y="414.575" fill="#000" font-size="20" textLength="40" font-family="SimSun">0..1</text><text x="357.625" y="450.416" fill="#000" font-size="20" textLength="40" font-family="SimSun">0..1</text></g><!--link payment_order to payment_reconciliation--><g class="link" data-entity-1="ent0006" data-entity-2="ent0007" id="lnk11" data-source-line="48" data-link-type="association"><path d="M286.5,386.2 C286.5,449.08 286.5,528.91 286.5,591.79" style="stroke:#000;stroke-width:1;" fi