<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:750px;height:854px;background:#FFFFFF;" width="750px" height="854px" viewBox="0 0 750 854" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--cluster F--><g class="cluster" data-qualified-name="F" id="ent0001" data-source-line="18"><path d="M8.5,6 L195.125,6 A3.75,3.75 0 0 1 197.625,8.5 L204.625,34.813 L732.5,34.813 A2.5,2.5 0 0 1 735,37.313 L735,836.5 A2.5,2.5 0 0 1 732.5,839 L8.5,839 A2.5,2.5 0 0 1 6,836.5 L6,8.5 A2.5,2.5 0 0 1 8.5,6" style="stroke:#000;stroke-width:1.5;" fill="#FFF"/><line x1="6" y1="34.813" x2="204.625" y2="34.813" style="stroke:#000;stroke-width:1.5;"/><text x="10" y="28" fill="#000" font-size="20" textLength="185.625" font-weight="700" font-family="SimSun">患者资金与真实到账</text></g><!--class patient_f--><g class="entity" data-qualified-name="F.patient_f" id="ent0002" data-source-line="20"><rect x="230" y="47" width="210" height="55.625" fill="#FFF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="295" y="72" fill="#000" font-size="20" textLength="80" font-style="italic" font-family="SimSun">«entity»</text><text x="315" y="94.813" fill="#000" font-size="20" textLength="40" font-family="SimSun">患者</text></g><!--class refund_f--><g class="entity" data-qualified-name="F.refund_f" id="ent0003" data-source-line="22"><rect x="22" y="744.5" width="210" height="55.625" fill="#FFF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="87" y="769.5" fill="#000" font-size="20" textLength="80" font-style="italic" font-family="SimSun">«entity»</text><text x="87" y="792.313" fill="#000" font-size="20" textLength="80" font-family="SimSun">退款办理</text></g><!--class patient_funds--><g class="entity" data-qualified-name="F.patient_funds" id="ent0004" data-source-line="23"><rect x="214" y="178" width="242" height="162.875" fill="#FFF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="295" y="203" fill="#000" font-size="20" textLength="80" font-style="italic" font-family="SimSun">«entity»</text><text x="295" y="225.813" fill="#000" font-size="20" textLength="80" font-family="SimSun">患者资金</text><line x1="215" y1="233.625" x2="455" y2="233.625" style="stroke:#181818;stroke-width:0.5;"/><text x="220" y="257.625" fill="#000" font-size="20" textLength="200" font-family="SimSun">建立时间、归属经办人</text><text x="220" y="280.438" fill="#000" font-size="20" textLength="190" font-family="SimSun">/同患者资金收付汇总</text><line x1="215" y1="287.25" x2="455" y2="287.25" style="stroke:#181818;stroke-width:1;"/><text x="220" y="311.25" fill="#000" font-size="20" textLength="190" font-family="SimSun">+核对唯一患者归属()</text><text x="220" y="334.063" fill="#000" font-size="20" textLength="230" font-family="SimSun">+汇总确认收付与未用款()</text></g><!--class patient_payment--><g class="entity" data-qualified-name="F.patient_payment" id="ent0005" data-source-line="30"><rect x="194" y="416" width="282" height="231.313" fill="#FFF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="295" y="441" fill="#000" font-size="20" textLength="80" font-style="italic" font-family="SimSun">«entity»</text><text x="295" y="463.813" fill="#000" font-size="20" textLength="80" font-family="SimSun">患者付款</text><line x1="195" y1="471.625" x2="475" y2="471.625" style="stroke:#181818;stroke-width:0.5;"/><text x="200" y="495.625" fill="#000" font-size="20" textLength="260" font-family="SimSun">实收、找零、渠道、核实状态</text><text x="200" y="518.438" fill="#000" font-size="20" textLength="220" font-family="SimSun">到账时间、核实人及凭据</text><text x="200" y="541.25" fill="#000" font-size="20" textLength="180" font-family="SimSun">/净收、/原款可用额</text><line x1="195" y1="548.063" x2="475" y2="548.063" style="stroke:#181818;stroke-width:1;"/><text x="200" y="572.063" fill="#000" font-size="20" textLength="210" font-family="SimSun">+核对实收找零与净收()</text><text x="200" y="594.875" fill="#000" font-size="20" textLength="250" font-family="SimSun">+确认实际到账(原单与依据)</text><text x="200" y="617.688" fill="#000" font-size="20" textLength="210" font-family="SimSun">+记录未到账核实(依据)</text><text x="200" y="640.5" fill="#000" font-size="20" textLength="270" font-family="SimSun">+计算原款可用额(用途与退款)</text></g><g class="entity" data-qualified-name="F.GMN9" id="ent0010" data-source-line="44"><path d="M297.5,722 L297.5,823.25 A0,0 0 0 0 297.5,823.25 L718.5,823.25 A0,0 0 0 0 718.5,823.25 L718.5,732 L708.5,722 L390.75,722 L386.75,647.06 L382.75,722 L297.5,722 A0,0 0 0 0 297.5,722" style="stroke:#000;stroke-width:0.5;" fill="#FFF"/><path d="M708.5,722 L708.5,732 L718.5,732 L708.5,722" style="stroke:#000;stroke-width:0.5;" fill="#FFF"/><text x="303.5" y="747" fill="#000" font-size="20" textLength="380" font-family="SimSun">净收＝实收－找零＞0；电子支付找零为0。</text><text x="303.5" y="769.813" fill="#000" font-size="20" textLength="400" font-family="SimSun">原款可用＝确认净收－用途净额－已确认退款</text><text x="303.5" y="792.625" fill="#000" font-size="20" textLength="380" font-family="SimSun">－待办或待核实退款占用；未知不记到账。</text><text x="303.5" y="815.438" fill="#000" font-size="20" textLength="400" font-family="SimSun">未分配预收不计本账抵付，抵扣不增加实收。</text></g><!--link patient_f to patient_funds--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk6" data-source-line="40" data-link-type="association"><path d="M335,103.02 C335,122.98 335,150.91 335,177.65" style="stroke:#000;stroke-width:1;" fill="none" id="patient_f-patient_funds" codeLine="40"/><text x="324.047" y="130.571" fill="#000" font-size="20" font-family="SimSun">1</text><text x="324.539" y="167.134" fill="#000" font-size="20" font-family="SimSun">1</text></g><!--link patient_funds to patient_payment--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk7" data-source-line="41" data-link-type="association"><path d="M335,341.11 C335,364.58 335,390.64 335,415.76" style="stroke:#000