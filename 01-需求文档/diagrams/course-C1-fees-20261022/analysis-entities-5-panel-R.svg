<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:813px;height:639px;background:#FFFFFF;" width="813px" height="639px" viewBox="0 0 813 639" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--cluster R--><g class="cluster" data-qualified-name="R" id="ent0001" data-source-line="18"><path d="M8.5,6 L215.75,6 A3.75,3.75 0 0 1 218.25,8.5 L225.25,34.813 L795.5,34.813 A2.5,2.5 0 0 1 798,37.313 L798,621.5 A2.5,2.5 0 0 1 795.5,624 L8.5,624 A2.5,2.5 0 0 1 6,621.5 L6,8.5 A2.5,2.5 0 0 1 8.5,6" style="stroke:#000;stroke-width:1.5;" fill="#FFF"/><line x1="6" y1="34.813" x2="225.25" y2="34.813" style="stroke:#000;stroke-width:1.5;"/><text x="10" y="28" fill="#000" font-size="20" textLength="206.25" font-weight="700" font-family="SimSun">原单申请与负责人审核</text></g><!--class funds_r--><g class="entity" data-qualified-name="R.funds_r" id="ent0002" data-source-line="20"><rect x="22" y="47" width="210" height="55.625" fill="#FFF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="87" y="72" fill="#000" font-size="20" textLength="80" font-style="italic" font-family="SimSun">«entity»</text><text x="87" y="94.813" fill="#000" font-size="20" textLength="80" font-family="SimSun">患者资金</text></g><!--class bill_r--><g class="entity" data-qualified-name="R.bill_r" id="ent0003" data-source-line="22"><rect x="297" y="47" width="210" height="55.625" fill="#FFF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="362" y="72" fill="#000" font-size="20" textLength="80" font-style="italic" font-family="SimSun">«entity»</text><text x="362" y="94.813" fill="#000" font-size="20" textLength="80" font-family="SimSun">应收账目</text></g><!--class payment_r--><g class="entity" data-qualified-name="R.payment_r" id="ent0004" data-source-line="24"><rect x="572" y="47" width="210" height="55.625" fill="#FFF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="637" y="72" fill="#000" font-size="20" textLength="80" font-style="italic" font-family="SimSun">«entity»</text><text x="637" y="94.813" fill="#000" font-size="20" textLength="80" font-family="SimSun">患者付款</text></g><!--class fee_request--><g class="entity" data-qualified-name="R.fee_request" id="ent0005" data-source-line="25"><rect x="251" y="178" width="302" height="276.938" fill="#FFF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="362" y="203" fill="#000" font-size="20" textLength="80" font-style="italic" font-family="SimSun">«entity»</text><text x="362" y="225.813" fill="#000" font-size="20" textLength="80" font-family="SimSun">费用申请</text><line x1="252" y1="233.625" x2="552" y2="233.625" style="stroke:#181818;stroke-width:0.5;"/><text x="257" y="257.625" fill="#000" font-size="20" textLength="260" font-family="SimSun">原因、证据、提交版本及时间</text><text x="257" y="280.438" fill="#000" font-size="20" textLength="180" font-family="SimSun">拟调整额、拟退上限</text><text x="257" y="303.25" fill="#000" font-size="20" textLength="280" font-family="SimSun">申请状态、批准调整及退款上限</text><text x="257" y="326.063" fill="#000" font-size="20" textLength="180" font-family="SimSun">审核人、时间及意见</text><line x1="252" y1="332.875" x2="552" y2="332.875" style="stroke:#181818;stroke-width:1;"/><text x="257" y="356.875" fill="#000" font-size="20" textLength="250" font-family="SimSun">+核对原单归属及申请额度()</text><text x="257" y="379.688" fill="#000" font-size="20" textLength="170" font-family="SimSun">+提交或补正重提()</text><text x="257" y="402.5" fill="#000" font-size="20" textLength="290" font-family="SimSun">+记录批准退回或拒绝(审核依据)</text><text x="257" y="425.313" fill="#000" font-size="20" textLength="170" font-family="SimSun">+撤回未审核申请()</text><text x="257" y="448.125" fill="#000" font-size="20" textLength="230" font-family="SimSun">+计算剩余可办退款额度()</text></g><g class="entity" data-qualified-name="R.GMN11" id="ent0012" data-source-line="43"><path d="M171.5,530 L171.5,608.438 A0,0 0 0 0 171.5,608.438 L632.5,608.438 A0,0 0 0 0 632.5,608.438 L632.5,540 L622.5,530 L406,530 L402,455.31 L398,530 L171.5,530 A0,0 0 0 0 171.5,530" style="stroke:#000;stroke-width:0.5;" fill="#FFF"/><path d="M622.5,530 L622.5,540 L632.5,540 L622.5,530" style="stroke:#000;stroke-width:0.5;" fill="#FFF"/><text x="177.5" y="555" fill="#000" font-size="20" textLength="380" font-family="SimSun">原账或原付款至少一项；都属于同一患者。</text><text x="177.5" y="577.813" fill="#000" font-size="20" textLength="440" font-family="SimSun">未批准不生效调整或退款；退回补正保留原提交。</text><text x="177.5" y="600.625" fill="#000" font-size="20" textLength="420" font-family="SimSun">批准额与真实退款分开，撤回仅限未审核申请。</text></g><!--link funds_r to fee_request--><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" id="lnk6" data-source-line="37" data-link-type="association"><path d="M232.27,85 C255.83,85 274,85 274,85 C274,85 274,128.52 274,177.83" style="stroke:#000;stroke-width:1;" fill="none" id="funds_r-fee_request" codeLine="37"/><text x="240.023" y="82.971" fill="#000" font-size="20" font-family="SimSun">1</text><text x="225.444" y="167.202" fill="#000" font-size="20" textLength="40" font-family="SimSun">0..*</text></g><!--link bill_r to fee_request--><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" id="lnk7" data-source-line="38" data-link-type="association"><path d="M402,103.18 C402,122.4 402,149.45 402,177.84" style="stroke:#000;stroke-width:1;" fill="none" id="bill_r-fee_request" codeLine="38"/><text x="358.313" y="130.513" fill="#000" font-size="20" textLength="40" font-family="SimSun">0..1</text><text x="360.844" y="167.213" fill="#000" font-size="20" textLength="40" font-family="SimSun">0..*</text></g><!--link payment_r to fee_request--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" id="lnk8" data-source-line="39" data-link-type="association"><path d="M571.73,85 C548.17,85 530,85 530,85 C530,85 530,128.52 530,177.83" style="stroke:#000