13" fill="#000" font-size="20" textLength="80" font-family="SimSun">预付抵扣</text></g><g class="entity" data-qualified-name="V.GMN13" id="ent0014" data-source-line="43"><path d="M298.5,461 L298.5,539.438 A0,0 0 0 0 298.5,539.438 L779.5,539.438 A0,0 0 0 0 779.5,539.438 L779.5,471 L769.5,461 L543,461 L539,386.21 L535,461 L298.5,461 A0,0 0 0 0 298.5,461" style="stroke:#000;stroke-width:0.5;" fill="#FFF"/><path d="M769.5,461 L769.5,471 L779.5,471 L769.5,461" style="stroke:#000;stroke-width:0.5;" fill="#FFF"/><text x="304.5" y="486" fill="#000" font-size="20" textLength="460" font-family="SimSun">分配与抵扣仅记录资金用途，同一用途不重复入账。</text><text x="304.5" y="508.813" fill="#000" font-size="20" textLength="440" font-family="SimSun">负数仅释放有依据的原正向用途，累计不超原额；</text><text x="304.5" y="531.625" fill="#000" font-size="20" textLength="440" font-family="SimSun">与批准调整共同生效；退款另记录真实交付结果。</text></g><!--link payment_V to prepayment_offset--><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" id="lnk6" data-source-line="34" data-link-type="association"><path d="M462.5,103.35 C462.5,122.95 462.5,150.35 462.5,177.81" style="stroke:#000;stroke-width:1;" fill="none" id="payment_V-prepayment_offset" codeLine="34"/><text x="462.733" y="130.715" fill="#000" font-size="20" font-family="SimSun">1</text><text x="415.413" y="167.362" fill="#000" font-size="20" textLength="40" font-family="SimSun">0..*</text></g><!--link bill_V to prepayment_offset--><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" id="lnk7" data-source-line="35" data-link-type="association"><path d="M616,103.35 C616,122.95 616,150.35 616,177.81" style="stroke:#000;stroke-width:1;" fill="none" id="bill_V-prepayment_offset" codeLine="35"/><text x="593.831" y="130.715" fill="#000" font-size="20" font-family="SimSun">1</text><text x="580.186" y="167.362" fill="#000" font-size="20" textLength="40" font-family="SimSun">0..*</text></g><!--link request_V to prepayment_offset--><g class="link" data-entity-1="ent0004" data-entity-2=