<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:1088px;height:570px;background:#FFFFFF;" width="1088px" height="570px" viewBox="0 0 1088 570" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--cluster U--><g class="cluster" data-qualified-name="U" id="ent0001" data-source-line="18"><path d="M8.5,6 L195.125,6 A3.75,3.75 0 0 1 197.625,8.5 L204.625,34.813 L1070.5,34.813 A2.5,2.5 0 0 1 1073,37.313 L1073,552.5 A2.5,2.5 0 0 1 1070.5,555 L8.5,555 A2.5,2.5 0 0 1 6,552.5 L6,8.5 A2.5,2.5 0 0 1 8.5,6" style="stroke:#000;stroke-width:1.5;" fill="#FFF"/><line x1="6" y1="34.813" x2="204.625" y2="34.813" style="stroke:#000;stroke-width:1.5;"/><text x="10" y="28" fill="#000" font-size="20" textLength="185.625" font-weight="700" font-family="SimSun">付款分配与批准释放</text></g><!--class payment_U--><g class="entity" data-qualified-name="U.payment_U" id="ent0002" data-source-line="20"><rect x="297" y="47" width="210" height="55.625" fill="#FFF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="362" y="72" fill="#000" font-size="20" textLength="80" font-style="italic" font-family="SimSun">«entity»</text><text x="362" y="94.813" fill="#000" font-size="20" textLength="80" font-family="SimSun">患者付款</text></g><!--class bill_U--><g class="entity" data-qualified-name="U.bill_U" id="ent0003" data-source-line="22"><rect x="572" y="47" width="210" height="55.625" fill="#FFF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="637" y="72" fill="#000" font-size="20" textLength="80" font-style="italic" font-family="SimSun">«entity»</text><text x="637" y="94.813" fill="#000" font-size="20" textLength="80" font-family="SimSun">应收账目</text></g><!--class request_U--><g class="entity" data-qualified-name="U.request_U" id="ent0004" data-source-line="24"><rect x="847" y="47" width="210" height="55.625" fill="#FFF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="912" y="72" fill="#000" font-size="20" textLength="80" font-style="italic" font-family="SimSun">«entity»</text><text x="912" y="94.813" fill="#000" font-size="20" textLength="80" font-family="SimSun">费用申请</text></g><!--class payment_allocation--><g class="entity" data-qualified-name="U.payment_allocation" id="ent0005" data-source-line="25"><rect x="418" y="178" width="242" height="208.5" fill="#FFF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="499" y="203" fill="#000" font-size="20" textLength="80" font-style="italic" font-family="SimSun">«entity»</text><text x="499" y="225.813" fill="#000" font-size="20" textLength="80" font-family="SimSun">付款分配</text><line x1="419" y1="233.625" x2="659" y2="233.625" style="stroke:#181818;stroke-width:0.5;"/><text x="424" y="257.625" fill="#000" font-size="20" textLength="200" font-family="SimSun">带符号金额、生效时间</text><text x="424" y="280.438" fill="#000" font-size="20" textLength="220" font-family="SimSun">经办人、分配或释放原因</text><line x1="419" y1="287.25" x2="659" y2="287.25" style="stroke:#181818;stroke-width:1;"/><text x="424" y="311.25" fill="#000" font-size="20" textLength="230" font-family="SimSun">+核对可分配原款与待付()</text><text x="424" y="334.063" fill="#000" font-size="20" textLength="150" font-family="SimSun">+登记本账用途()</text><text x="424" y="356.875" fill="#000" font-size="20" textLength="210" font-family="SimSun">+释放原用途(批准申请)</text><text x="424" y="379.688" fill="#000" font-size="20" textLength="190" font-family="SimSun">+汇总有效用途净额()</text></g><!--class allocation_previous--><g class="entity" data-qualified-name="U.allocation_previous" id="ent0009" data-source-line="38"><rect x="22" y="47" width="210" height="55.625" fill="#FFF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="87" y="72" fill="#000" font-size="20" textLength="80" font-style="italic" font-family="SimSun">«entity»</text><text x="87" y="94.813" fill="#000" font-size="20" textLength="80" font-family="SimSun">付款分配</text></g><g class="entity" data-qualified-name="U.GMN13" id="ent0014" data-source-line="43"><path d="M298.5,461 L298.5,539.438 A0,0 0 0 0 298.5,539.438 L779.5,539.438 A0,0 0 0 0 779.5,539.438 L779.5,471 L769.5,461 L543,461 L539,386.21 L535,461 L298.5,461 A0,0 0 0 0 298.5,461" style="stroke:#000;stroke-width:0.5;" fill="#FFF"/><path d="M769.5,461 L769.5,471 L779.5,471 L769.5,461" style="stroke:#000;stroke-width:0.5;" fill="#FFF"/><text x="304.5" y="486" fill="#000" font-size="20" textLength="460" font-family="SimSun">分配与抵扣仅记录资金用途，同一用途不重复入账。</text><text x="304.5" y="508.813" fill="#000" font-size="20" textLength="440" font-family="SimSun">负数仅释放有依据的原正向用途，累计不超原额；</text><text x="304.5" y="531.625" fill="#000" font-size="20" textLength="440" font-family="SimSun">与批准调整共同生效；退款另记录真实交付结果。</text></g><!--link payment_U to payment_allocation--><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" id="lnk6" data-source-line="34" data-link-type="association"><path d="M462.5,103.35 C462.5,122.95 462.5,150.35 462.5,177.81" style="stroke:#000;stroke-width:1;" fill="none" id="payment_U-payment_allocation" codeLine="34"/><text x="462.733" y="130.715" fill="#000" font-size="20" font-family="SimSun">1</text><text x="415.413" y="167.362" fill="#000" font-size="20" textLength="40" font-family="SimSun">0..*</text></g><!--link bill_U to payment_allocation--><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" id="lnk7" data-source-line="35" data-link-type="association"><path d="M616,103.35 C616,122.95 616,150.35 616,177.81" style="stroke:#000;stroke-width:1;" fill="none" id="bill_U-payment_allocation" codeLine="35"/><text x="593.831" y="130.715" fill="#000" font-size="20" font-family="SimSun">1</text><text x="580.186" y="167.362" fill="#000" font-size="20" textLength="40" font-family="SimSun">0..*</text></g><!--link request_U to payment_allocation--><g class="link" data-entity-1="ent0004"