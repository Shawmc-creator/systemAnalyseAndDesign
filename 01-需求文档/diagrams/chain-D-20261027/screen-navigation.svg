" font-family="SimSun">处方开立／实际接诊结束</text></g><!--entity AS--><g class="entity" data-qualified-name="AS" id="ent0006" data-source-line="17"><rect x="47.83" y="212" width="286" height="106.688" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="57.83" y="241" fill="#000" font-size="19" textLength="95" font-family="SimSun">助理工作台</text><text x="57.83" y="262.672" fill="#000" font-size="19" textLength="266" font-family="SimSun">原件上传／材料批次／采购验收</text><text x="57.83" y="284.344" fill="#000" font-size="19" textLength="228" font-family="SimSun">库存领退及用料／盘点提交</text><text x="57.83" y="306.016" fill="#000" font-size="19" textLength="209" font-family="SimSun">资源准备与实际清洁核查</text></g><!--entity CA--><g class="entity" data-qualified-name="CA" id="ent0008" data-source-line="19"><rect x="357.83" y="212" width="286" height="106.688" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="367.83" y="241" fill="#000" font-size="19" textLength="95" font-family="SimSun">收费工作台</text><text x="367.83" y="262.672" fill="#000" font-size="19" textLength="266" font-family="SimSun">报价核价出具／账单与真实收款</text><text x="367.83" y="284.344" fill="#000" font-size="19" textLength="247" font-family="SimSun">医保预结算、结算及实际回款</text><text x="367.83" y="306.016" fill="#000" font-size="19" textLength="114" font-family="SimSun">经营原单核对</text></g><!--entity MG--><g class="entity" data-qualified-name="MG" id="ent0010" data-source-line="21"><rect x="28.83" y="347" width="324" height="128.359" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="38.83" y="376" fill="#000" font-size="19" textLength="304" font-family="SimSun">负责人工作台（按门店／连锁授权）</text><text x="38.83" y="397.672" fill="#000" font-size="19" textLength="209" font-family="SimSun">人员账号与诊椅基础管理</text><text x="38.83" y="419.344" fill="#000" font-size="19" textLength="228" font-family="SimSun">排班及影响协调／价目审核</text><text x="38.83" y="441.016" fill="#000" font-size="19" textLength="228"