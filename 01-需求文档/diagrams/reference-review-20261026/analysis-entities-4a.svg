/g><g class="entity" data-qualified-name="P.GMN5" id="ent0006" data-source-line="38"><path d="M22.5,607.5 L22.5,685.938 A0,0 0 0 0 22.5,685.938 L423.5,685.938 A0,0 0 0 0 423.5,685.938 L423.5,617.5 L413.5,607.5 L227,607.5 L223,486.35 L219,607.5 L22.5,607.5 A0,0 0 0 0 22.5,607.5" style="stroke:#000;stroke-width:0.5;" fill="#FFF"/><path d="M413.5,607.5 L413.5,617.5 L423.5,617.5 L413.5,607.5" style="stroke:#000;stroke-width:0.5;" fill="#FFF"/><text x="28.5" y="632.5" fill="#000" font-size="20" textLength="360" font-family="SimSun">适用期间左闭右开；已确认区间不重叠。</text><text x="28.5" y="655.313" fill="#000" font-size="20" textLength="320" font-family="SimSun">零价有依据；调价不改原账单快照。</text><text x="28.5" y="678.125" fill="#000" font-size="20" textLength="380" font-family="SimSun">已用项目换单位另建项目，停用保留历史。</text></g><!--class patient_f--><g class="entity" data-qualified-name="F.patient_f" id="ent0009" data-source-line="45"><rect x="673" y="100.5" width="210" height="55.625" fill="#FFF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="738" y="125.5" fill="#000" font-size="20" textLength="80" font-style="italic" font-family="SimSun">«entity»</text><text x="758" y="148.313" fill="#000" font-size="20" textLength="40" font-family="SimSun">患者</text></g><!--class refund_f--><g class="entity" data-qualified-name="F.refund_f" id="ent0010" data-source-line="47"><rect x="480" y="829.5" width="210" height="55.625" fill="#FFF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="545" y="854.5" fill="#000" font-size="20" textLength="80" font-style="italic" font-family="SimSun">«entity»</text><text x="545" y="877.313" fill="#000" font-size="20" textLength="80" font-family="SimSun">退款办理</text></g><!--class patient_funds--><g class="entity" data-qualified-name="F.patient_funds" id="ent0011" data-source-line="48"><rect x="657" y="289" width="242" height="162.875" fill="#FFF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="738" y="314" fill="#000" font-size="20" textLength="80" font-style="italic" font-family="SimSun">«entity»</text><text x="738" y="336.813" fill="#000" font-size="20" textLength="80" font-family="SimSun">患者资金</text><line x1="658" y1="344.625" x2="898" y2="344.625" style="stroke:#181818;stroke-width:0.5;"/><text x="663" y="368.625" fill="#000" font-size="20" textLength="200" font-family="SimSun">建立时间、归属经办人</text><text x="663" y="391.438" fill="#000" font-size="20" textLength="190" font-family="SimSun">/同患者资金收付汇总</text><line x1="658" y1="398.25" x2="898" y2="398.25" style="stroke:#181818;stroke-width:1;"/><text x="663" y="422.25" fill="#000" font-size="20" textLength="190" font-family="SimSun">+核对唯一患者归属()</text><text x="663" y="445.063" fill="#000" font-size="20" textLength="230" font-family="SimSun">+汇总确认收付与未用款()</text></g><!--class patient_payment--><g class="entity" data-qualified-name="F.patient_payment" id="ent0012" data-source-line="55"><rect x="637" y="531" width="282" height="231.313" fill="#FFF" style="stroke:#181818;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="738" y="556" fill="#000" font-size="20" textLength="80" font-style="italic" font-family="SimSun">«entity»</text><text x="738" y="578.813" fill="#000" font-size="20" textLength="80" font-family="SimSun">患者付款</text><line x1="638" y1="586.625" x2="918" y2="586.625" style="stroke:#181818;stroke-width:0.5;"/><text x="643" y="610.625" fill="#000" font-size="20" textLength="260" font-family="SimSun">实收、找零、渠道、核实状态</text><text x="643" y="633.438" fill="#000" font-size="20" textLength="220" font-family="SimSun">到账时间、核实人及凭据</text><text x="643" y="656.25" fill="#000" font-size="20" textLength="180" font-family="SimSun">/净收、/原款可用额</text><line x1="638" y1="663.063" x2="918" y2="663.063" style="stroke:#181818;stroke-width:1;"/><text x="643" y="687.063" fill="#000" font-size="20" textLength="210" font-family="SimSun">+核对实收找零与净收()</text><text x="643" y="709.875" fill="#000" font-size="20" textLength="250" font-family="SimSun">+确认实际到账(原单与依据)</text><text x="643" y="732.688" fill="#000" font-size="20" textLength="210" font-family="SimSun">+记录未到账核实(依据)</text><text x="643" y="755.5" fill="#000" font-size="20" textLength="270" font-family="SimSun">+计算原款可用额(用途与退款)</text></g><g class="entity" data-qualified-name="F.GMN16" id="ent0017" data-source-line="69"><path d="M725.5,807 L725.5,908.25 A0,0 0 0 0 725.5,908.25 L1146.5,908.25 A0,0 0 0 0 1146.5,908.25 L1146.5,817 L1136.5,807 L826.25,807 L822.25,762.19 L818.25,807 L725.5,807 A0,0 0 0 0 725.5,807" style="stroke:#000;stroke-width:0.5;" fill="#FFF"/><path d="M1136.5,807 L1136.5,817 L1146.5,817 L1136.5,807" style="stroke:#000;stroke-width:0.5;" fill="#FFF"/><text x="731.5" y="832" fill="#000" font-size="20" textLength="380" font-family="SimSun">净收＝实收－找零＞0；电子支付找零为0。</text><text x="731.5" y="854.813" fill="#000" font-size="20" textLength="400" font-family="SimSun">原款可用＝确认净收－用途净额－已确认退款</text><text x="731.5" y="877.625" fill="#000" font-size="20" textLength="380" font-family="SimSun">－待办或待核实退款占用；未知不记到账。</text><text x="731.5" y="900.438" fill="#000" font-size="20" textLength="400" font-family="SimSun">未分配预收不计本账抵付，抵扣不增加实收。</text></g><!--reverse link service to service_price--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk4" data-source-line="36" data-link-type="composition"><path d="M223,222.09 C223,236.5 223,239.75 223,254.88" style="stroke:#000;stroke-width:1;" fill="none" id="service-backto-service_price" codeLine="36"/><polygon points="223,210.09,219,216.09,223,222.09,227,216.09,223,210.09" fill="#000" style="stroke:#000;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="212.586" y="237.796" fill="#000" font-size="20" font-family="SimSun">1</text><text x="181.594" y="243.995" fill="#000" font-size="20" textLength="40" font-family="SimSun">0..*</text></g><!--link patient_f to patient_funds--><g class="link" data-entity-1="ent0009" data-entity-2="ent0011" id="lnk13" data-source-line="65" data-link-type="association"><path d="M778,156.73 C7