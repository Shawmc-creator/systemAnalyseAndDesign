<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>患者自助预约 · 青禾牙科演示</title><link rel="stylesheet" href="/patient-demo.css">
<script src="/booking-calendar.js" defer></script><script src="/patient-demo.js" defer></script></head>
<body><header><div class="header-inner"><a href="/">青禾牙科 <span>连锁演示</span></a><a href="/">工作人员入口</a></div></header>
<main>
<div id="notice" role="status" aria-live="polite" hidden></div>
<section class="patient-login" id="login-panel" aria-labelledby="patient-login-title">
  <div class="patient-login-overview">
    <span class="badge">课程演示</span>
    <h1>预约就诊</h1>
    <p>预订三家演示门店的就诊时段，也可以查询和取消自己的预约。</p>
    <ol class="booking-steps">
      <li>选择门店和日期</li>
      <li>选择时间和医生</li>
      <li>确认就诊目的</li>
    </ol>
    <p class="patient-login-note">请使用虚构信息体验预约。</p>
  </div>
  <div class="card login-card">
    <h2 id="patient-login-title">患者登录</h2>
    <p class="login-demo-account">演示账号 <code>patient</code><span>密码 <code>Patient123</code></span></p>
    <form id="login" method="post">
      <label>账号<input name="username" required autocomplete="username" autocapitalize="none" spellcheck="false"></label>
      <label>密码<input name="password" required type="password" autocomplete="current-password"></label>
      <div class="login-actions">
        <button type="submit">登录</button>
        <button id="demo-login" class="secondary" type="button">使用演示账号</button>
      </div>
    </form>
  </div>
</section>
<div id="workspace" hidden>
  <div class="intro"><div><h1>预约就诊</h1><p>选择门店、日期、时间和医生，在线管理您的预约。</p></div><span class="badge">课程演示</span></div>
<div class="account"><div class="account-name"><span>当前患者</span><strong id="patient-name"></strong></div><button class="secondary" id="logout" type="button">退出登录</button></div>
<div class="layout"><section class="card"><h2>新建预约</h2>
<form id="booking">
<label class="branch-field">门店<select name="branch" required></select></label>
<fieldset><legend>1. 选择日期</legend>
<div class="calendar"><div class="calendar-nav"><button type="button" id="previous" class="secondary" aria-label="上个月">‹</button><strong id="month"></strong><button type="button" id="next" class="secondary" aria-label="下个月">›</button></div>
<div class="calendar-grid weekdays" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
<div id="days" class="calendar-grid"></div></div>
<p id="date-hint" class="hint"></p></fieldset>
<fieldset><legend>2. 选择时间 <small>每次 30 分钟</small></legend><div class="choices" id="times"></div></fieldset>
<div class="row"><label>3. 选择医生<select name="doctor" required disabled></select></label>
<label>4. 选择就诊目的<select name="reason" required></select></label></div>
<button type="submit" id="book-submit" disabled>确认预约</button>
</form></section>
<section class="card"><div class="section-title"><h2>我的预约</h2><button class="secondary" id="refresh" type="button">刷新</button></div>
<div id="bookings"></div></section>
</div></div></main></body></html>
