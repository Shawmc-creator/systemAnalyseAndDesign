<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>患者自助预约 · 青禾牙科演示</title><link rel="stylesheet" href="/patient-demo.css"><script src="/patient-demo.js" defer></script></head>
<body><header><div class="header-inner"><a href="/">青禾牙科 <span>连锁演示</span></a><a href="/">工作人员入口</a></div></header>
<main><div class="intro"><div><p class="eyebrow">患者服务</p><h1>预约就诊</h1><p>选择合适的门店、医生和时间，在这里查看或取消预约。</p></div><span class="badge">虚构患者演示</span></div>
<div class="warning">本页面仅使用固定的虚构演示患者。无需真实身份验证，请勿输入真实个人信息。</div>
<div id="notice" role="status" aria-live="polite" hidden></div>
<div class="layout"><section class="card"><h2>新建预约</h2><p class="hint">预约前请先选择门店和已发布的接诊排班。</p>
<form id="booking"><label>门店<select name="branch" required></select></label><label>接诊排班<select name="schedule" required></select></label>
<label>可预约时间（每次 30 分钟）<select name="slot" required></select></label>
<label>就诊目的<input name="reason" maxlength="100" required value="口腔检查（虚构示例）"></label><button type="submit">确认预约</button></form>
<p class="hint">医生、诊椅及患者时间冲突会在提交时自动核对。如无排班，请由工作人员先发布门店接诊排班。</p></section>
<section class="card"><div class="section-title"><div><h2>我的预约</h2><p class="hint">以下为同一虚构患者的预约记录。</p></div><button class="secondary" id="refresh" type="button">刷新</button></div><div id="bookings"><p class="hint">正在加载预约记录…</p></div></section></div></main></body></html>
